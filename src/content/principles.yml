- id: principle-1
  n: 1
  title: Honor the Web of Life
  tagline: All beings are interconnected. Your actions ripple outward through systems you cannot see.
- id: principle-2
  n: 2
  title: Dwell in Deep Time
  tagline: You are a temporary expression of ancient processes. Think in scales of mountains and forests.
- id: principle-3
  n: 3
  title: Seek Clarity Through Practice
  tagline: Meditation, movement, silence, and study sharpen your perception and reduce your suffering.
- id: principle-4
  n: 4
  title: Give and Receive in Reciprocity
  tagline: Nothing is owed; everything is a gift. Take only what you need. Give back more than you take.
- id: principle-5
  n: 5
  title: Remember Your Ancestors
  tagline: You carry forward the survival, wisdom, and stories of those who came before. Honor them by living fully.
- id: principle-6
  n: 6
  title: Gather and Break Bread
  tagline: Community, hospitality, and presence with others are sacred. Show up for your people.
- id: principle-7
  n: 7
  title: Question Everything; Revere the Search
  tagline: Study, debate, and intellectual honesty are spiritual acts. Never accept simplified narratives.
- id: principle-8
  n: 8
  title: Stand Humbly Before the Unknowable
  tagline: You are small. Mystery is a reality to inhabit, and inhabiting it is enough. Wonder is enough.
