- id: practice-ancestors
  label: Ancestors
  text: I woke today because others endured before me — through crossings I cannot imagine, in languages I no longer speak. I carry their survival in my body. This morning, with this tea, I remember them. I am the continuation.
- id: practice-trees-living-world
  label: Trees & Living World
  text: The trees on my street were here before I was and may outlast me. The nearest park is exhaling right now, and I am breathing what the trees give. I am not separate from this neighborhood. I am a neighbor to all of it.
- id: practice-presence-with-loved-ones
  label: Presence with Loved Ones
  text: This person beside me, this animal against my leg — they will not always be here, and neither will I. Let me not miss this morning by thinking about the afternoon. Let me be fully where I am, with whom I am.
- id: practice-deep-time
  label: Deep Time
  text: The sun that warms this morning has risen over this place for four and a half billion years. The hills I see were seafloor once. The tea in my hands grew from soil that was stone, that was magma, that was stardust. I am a brief visitor in an ancient story. That is enough.
- id: practice-seasonal-awareness
  label: Seasonal Awareness
  text: What season is it — not on the calendar, but in the world? What is blooming, what is dormant, what is migrating through? Let me notice the light, the temperature, the angle of the sun. My body knows what time it is if I let it.
- id: practice-reciprocity
  label: Reciprocity
  text: "I have already received today: warmth, breath, this cup, this company. Before the day asks anything of me, let me ask what I will give back. Not out of guilt, but because exchange is how living systems endure."
- id: practice-wonder
  label: Wonder
  text: I do not understand why anything exists at all. I do not understand consciousness, or love, or why the light at this hour turns everything gold. I do not need to understand. Let me begin this day in honest amazement.
- id: practice-embodied-attention
  label: Embodied Attention
  text: My body is not a vehicle for my mind. It is the instrument through which I know the world. For this next hour, let me attend to what it tells me — the pull, the breath, the ground beneath my feet.
- id: practice-the-tracker-s-eye
  label: The Tracker's Eye
  text: 'Boyd Varty says: "Tracking is the art of paying attention." On this run, on this court, let me track — the wind direction, the shadow length, the birds that scatter as I pass. The world is speaking. I am practicing how to listen.'
- id: practice-walking-meditation
  label: Walking Meditation
  text: Each step is an arrival, not a means to a destination. I am not going somewhere. I am here, and here, and here again. The ground receives my weight. I receive the ground.
- id: practice-entering-silence
  label: Entering Silence
  text: For the next hour I will not be reachable, and the world will continue without my attention. The notifications can accumulate. The news will still be the news when I return. What I am doing now — sitting with my own mind, without input — is older than any technology and more necessary than any of them.
- id: practice-gratitude
  label: Gratitude
  text: What did I receive today that I did not earn? A meal someone prepared. A conversation that surprised me. The particular quality of light at a particular hour. Let me name one gift before I sleep.
- id: practice-the-principles
  label: The Principles
  text: Which of [the eight](principles.html) did I embody today? Which did I neglect? No judgment — just observation. Tomorrow is another attempt. The practice is in the returning.
- id: practice-impermanence
  label: Impermanence
  text: This day is over and will not come again. Whatever I did or failed to do, it is done. Let me release it as a tree releases a leaf — not in grief, but because holding on is not what living things do.
- id: practice-connection
  label: Connection
  text: Who did I love well today? Who did I fail to see? Tomorrow, let me be more present to the people and creatures who share this life with me. They are not permanent. Neither am I.
