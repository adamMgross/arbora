- id: ancestral-dubnow-1
  text: '"The Jews have survived the mightiest empires of antiquity — Egypt, Assyria, Babylon, Greece, Rome — because they possessed an inner strength that did not depend on territory or political power, but on the life of the spirit and the solidarity of the community."'
  attribution: Simon Dubnow, *History of the Jews* (paraphrased from multiple passages)
- id: ancestral-heschel-1
  text: '"Just to be is a blessing. Just to live is holy."'
  attribution: Abraham Joshua Heschel, *Man Is Not Alone* (1951)
- id: ancestral-heschel-2
  text: '"Life is routine and routine is resistance to wonder."'
  attribution: Abraham Joshua Heschel, *Man Is Not Alone*
- id: ancestral-heschel-3
  text: "\"Wonder or radical amazement is the chief characteristic of the religious man's attitude toward history and nature. One attitude is alien to his spirit: taking things for granted, regarding events as a natural course of things.\""
  attribution: Abraham Joshua Heschel, *God in Search of Man* (1955)
- id: ancestral-levi-1
  text: |-
    "Consider if this is a man,
    Who labours in the mud,
    Who knows no peace,
    Who fights for a crust of bread,
    Who dies at a yes or a no.
    Consider if this is a woman,
    Without hair or name,
    With no more strength to remember,
    Empty eyes and cold womb
    Like a frog in winter.
    Consider that this has been:
    I commend these words to you.
    Engrave them on your hearts
    When you are in your house, when you walk on your way,
    When you go to bed, when you rise.
    Repeat them to your children."
  attribution: Primo Levi, epigraph to *If This Is a Man* (1947)
- id: ancestral-celan-1
  text: |-
    "Black milk of daybreak we drink it at evening
    we drink it at midday and morning we drink it at night
    we drink and we drink
    we shovel a grave in the air there you won't lie too cramped
    A man lives in the house he plays with the serpents he writes
    he writes when dusk falls to Germany your golden hair Margarete
    your ashen hair Shulamith we shovel a grave in the air there
    you won't lie too cramped."
  attribution: Paul Celan, "Death Fugue" (trans. Michael Hamburger)
- id: ancestral-sholem-aleichem-1
  text: "\"Lord of the Universe, it is revealed and known before You that if You had a little spare time and came down to our world to see how Your children the Jews are getting along, You would be appalled... Help us! Help us — for if You don't, who will?\""
  attribution: Sholem Aleichem, Tevye the Dairyman (adapted)
- id: ancestral-sholem-aleichem-2
  text: '"No matter what happens to you, keep going. You are a Jew, which means you have practice."'
  attribution: Sholem Aleichem (widely attributed, in the spirit of Tevye)
- id: ancestral-amichai-1
  text: "\"Jews in the Land of Israel...we forget where we came from. Our Jewish names from the Exile give us away, bring back the memory of flower and fruit, medieval cities, metals, knights who turned to feedback, the yearning of ships' masts for distance, spice boxes, gold, scarlet thread.\""
  attribution: Yehuda Amichai (trans. Benjamin and Barbara Harshav)
- id: ancestral-ansky-1
  text: '"Not only are the dead among the living, but the living are among the dead. The whole world is one great chain, and every link connects to every other."'
  attribution: S. Ansky, *The Dybbuk* (1914, adapted)
- id: ancestral-douglass-1
  text: '"I have often been utterly astonished, since I came to the north, to find persons who could speak of the singing, among slaves, as evidence of their contentment and happiness. It is impossible to conceive of a greater mistake. Slaves sing most when they are most unhappy. The songs of the slave represent the sorrows of his heart; and he is relieved by them, only as an aching heart is relieved by its tears."'
  attribution: Frederick Douglass, *Narrative* (1845)
- id: ancestral-milosz-1
  text: |-
    "What is poetry which does not save
    Nations or people?
    A connivance with official lies,
    A song of drunkards whose throats will be cut in a moment,
    Readings for sophomore girls.
    That I wanted good poetry without knowing it,
    That I discovered, late, its survey purpose,
    In this and only this I find salvation."
  attribution: Czeslaw Milosz, "Dedication" (trans. the author)
