- id: rituals-opening-1
  text: "*We light these candles to mark this time as different from ordinary time. For the next few hours, we are not producing, not consuming, not performing. We are here, together, and that is enough.*"
- id: rituals-opening-2
  text: "*We gather not because we must, but because the alternative — isolation dressed up as independence — is a lie our culture tells. We are social animals. We evolved around fire. This table is our fire tonight.*"
- id: rituals-the-meal-1
  text: "*We give thanks for this food — for the soil that grew it, the rain that fed it, the hands that prepared it, and the company that makes it more than fuel. We eat not alone but together, and in doing so we remember that eating is an act of connection to the living world.*"
- id: rituals-the-meal-2
  text: "*This cup holds the work of sun and rain and time. We share it as people have shared wine and water and tea for thousands of years — not because it is sacred in itself, but because the sharing is.*"
- id: rituals-closing-1
  text: "*We came to this table from separate days and separate weeks. We leave it having been, for a few hours, part of something older than any of us — the ancient human practice of gathering, feeding one another, and speaking honestly in the firelight. Go gently. Come back soon.*"
- id: rituals-spring-equinox-around-march-20-1
  text: "*The light and dark are equal today. From here, the days grow longer. Whatever we plant now — in soil, in habit, in relationship — has the whole growing season ahead of it. Let us begin.*"
- id: rituals-summer-solstice-around-june-21-1
  text: "*This is the most light we will receive. The mountains are open, the rivers are running, the world is as alive as it will be all year. Let us not waste the longest day. Let us fill it with the people and the places that matter.*"
- id: rituals-autumn-equinox-around-september-22-1
  text: "*The year has given abundantly. The days grow shorter now, and what remains of the light is precious. Let us gather what we have harvested — in knowledge, in friendship, in experience — and let go of what we no longer need to carry.*"
- id: rituals-winter-solstice-around-december-21-1
  text: "*This is the deepest dark. From tomorrow, the light returns — imperceptibly at first, then undeniably. Our ancestors marked this night because they understood: the dark is not the enemy. It is the rest before renewal. We light our candles not to banish the night but to honor it.*"
- id: rituals-welcoming-a-new-life-1
  text: "*You have arrived from somewhere none of us remember. You come with no language yet, no categories, no history of harm. You are the newest link in a chain that extends back through everyone in this room, back through their parents and theirs, back to the first humans who looked at the night sky and wondered, back further than that. We receive you. We offer you our names and our stories. You will make of them what only you can.*"
- id: rituals-coming-of-age-1
  text: "*Something is ending. The person you were before this threshold — their confusions, their dependencies, their way of being in the world — deserves a respectful farewell. What are you leaving behind? Name it. Now: what are you carrying forward? Name that too. The people in this room have watched you become who you are. They will continue watching. That is what a community is for.*"
- id: rituals-marriage-and-partnership-1
  text: "*You are choosing to make your life a joint project. Not to merge into one person — you will each remain yourselves, which is what makes the partnership worth having — but to say: whatever I encounter, I will encounter with you beside me. In abundance and in difficulty. In the years when everything is clear and in the years when nothing is. The people in this room are your witnesses. They will remember this, even when you forget.*"
- id: rituals-honoring-the-dead-1
  text: "*The dead are not absent. They are present in the specific way that the past is always present — in what we carry, in what we do because of them, in the choices they made that made our lives possible. We name them because naming is how we keep them in the living world a little longer. We tell their stories because stories are the only immortality any of us actually get.*"
- id: rituals-major-life-transition-1
  text: "*Every year the trees release their leaves. This is not failure — it is how trees conserve what matters and let go of what they no longer need to carry. Something is ending in your life. It served you. It may have cost you. It brought you here. Give it a respectful farewell. Then turn and face what is beginning. The people in this room will walk with you across the threshold.*"
- id: rituals-before-departure-1
  text: "*I am going to the mountains — not to conquer them, not to check a box, but to be in the presence of something older and larger than myself. I go as a student, a guest, a temporary participant in systems that were here long before me and will endure long after. Let me be worthy of the silence I am about to enter.*"
- id: rituals-returning-home-1
  text: "*I have come home from the mountains. What they gave me — silence, scale, the company of trees — does not vanish because I left. I carry the mountains in my body. The firs are in my lungs. The granite is in my sense of time. Let me not lose this too quickly. Let me bring some fraction of the mountain stillness into the city days.*"
