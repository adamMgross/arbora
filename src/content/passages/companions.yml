- id: companions-philosophy-ethics-1
  text: '"Wind extinguishes a candle and energizes fire. Likewise with randomness, uncertainty, chaos: you want to use them, not hide from them. You want to be the fire and wish for the wind."'
  attribution: Nassim Nicholas Taleb, *Antifragile*
- id: companions-philosophy-ethics-2
  text: '"The antifragile loves randomness and uncertainty, which also means — crucially — a love of a certain class of errors. Antifragility has a singular property of allowing us to deal with the unknown, to do things without understanding them."'
  attribution: Nassim Nicholas Taleb, *Antifragile*
- id: companions-traditional-indigenous-1
  text: "\"A tracker's question is not 'What do I want to find?' but 'What is here?' The difference is everything. One is about you. The other is about the world.\""
  attribution: Boyd Varty, *Lion Tracker's Guide to Life*
- id: companions-traditional-indigenous-2
  text: '"The secret of tracking is that the tracker has no agenda about where the track is going. They are fully in the present moment, reading only what is in front of them."'
  attribution: Boyd Varty, *Lion Tracker's Guide to Life*
