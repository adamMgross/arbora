- id: upanishads-chandogya-upanishad-1
  text: '*"That which is the subtle essence — in that have all things their existence. That is the truth. That is the Self. And thou, Shvetaketu, art that."*'
  attribution: Chandogya Upanishad 6.8.7 (trans. Max Müller)
- id: upanishads-chandogya-upanishad-2
  text: "*\"As bees make honey by gathering the juices of many trees, and reduce the juice into one form, and the juices do not know from which tree each came — even so, all these creatures, when they have merged into Being, do not know: 'We have merged into Being.'\"*"
  attribution: Chandogya Upanishad 6.9.1–2 (trans. Max Müller)
- id: upanishads-brihadaranyaka-upanishad-1
  text: |-
    *"From the unreal lead me to the real.
    From the darkness lead me to light.
    From death lead me to immortality."*
  attribution: Brihadaranyaka Upanishad 1.3.28 (trans. Swami Madhavananda)
- id: upanishads-brihadaranyaka-upanishad-2
  text: '*"As a spider sends forth and draws in its thread, as plants grow on the earth, as hair grows from the head and body of a living person — so from the Imperishable arises all things here."*'
  attribution: Brihadaranyaka Upanishad 1.1.7 (trans. Max Müller)
- id: upanishads-isha-upanishad-1
  text: '*"The whole world is pervaded by the Lord. Enjoy what has been given to you; do not covet what belongs to others."*'
  attribution: Isha Upanishad 1 (trans. Eknath Easwaran)
- id: upanishads-kena-upanishad-1
  text: '*"What cannot be spoken with words, but that whereby words are spoken — know that alone as Brahman. What cannot be thought with the mind, but that whereby the mind thinks — know that alone as Brahman."*'
  attribution: Kena Upanishad 1.4–6 (trans. Eknath Easwaran)
- id: upanishads-katha-upanishad-1
  text: '*"The Self is not born, nor does it die. It did not spring from anything, and nothing sprang from it. Unborn, eternal, everlasting, ancient — it is not slain when the body is slain."*'
  attribution: Katha Upanishad 1.2.18 (trans. Eknath Easwaran)
- id: upanishads-mundaka-upanishad-1
  text: '*"Taking as a bow the great weapon of the Upanishad, one should place upon it an arrow sharpened by meditation. Stretching it with a thought directed to the essence of That, penetrate the Imperishable as the mark."*'
  attribution: Mundaka Upanishad 2.2.3 (trans. Robert Ernest Hume)
- id: upanishads-bhagavad-gita-1
  text: '*"You have the right to work, but never to the fruit of work. You should never engage in action for the sake of reward, nor should you long for inaction."*'
  attribution: Bhagavad Gita 2.47 (trans. Eknath Easwaran)
- id: upanishads-bhagavad-gita-2
  text: '*"When a man dwells on the objects of sense, he creates an attraction for them; attraction develops into desire, and desire breeds anger. From anger comes delusion; from delusion, the failure of memory; from the failure of memory, the destruction of intelligence; and from the destruction of intelligence he perishes."*'
  attribution: Bhagavad Gita 2.62–63 (trans. Eknath Easwaran)
- id: upanishads-bhagavad-gita-3
  text: '*"I am the same to all beings. None is hateful to me, none dear. But those who worship me with devotion — they dwell in me, and I in them."*'
  attribution: Bhagavad Gita 9.29 (trans. Laurie L. Patton)
- id: upanishads-bhagavad-gita-4
  text: '*"Whenever the mind, unsteady and restless, strays away — from wherever it wanders, bring it back and return it to the control of the Self."*'
  attribution: Bhagavad Gita 6.26 (trans. Eknath Easwaran)
- id: upanishads-advaita-vedanta-1
  text: '*"Brahman alone is real. The world is appearance. The self is Brahman and nothing else."*'
  attribution: Adi Shankara, Vivekachudamani (trans. Swami Madhavananda)
- id: upanishads-advaita-vedanta-2
  text: '*"Like the space in a jar, the individual soul is enclosed within names and forms. When the jar is broken, the space merges with the infinite space. So too, when ignorance is destroyed, the individual soul merges with the Supreme Self."*'
  attribution: Adi Shankara, Atma Bodha (trans. Swami Chinmayananda)
