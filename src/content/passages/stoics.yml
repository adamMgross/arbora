- id: stoics-marcus-aurelius-1
  text: '"Constantly regard the universe as one living being, having one substance and one soul; and observe how all things have reference to one perception, the perception of this one living being; and how all things act with one movement; and how all things are the cooperating causes of all things that exist; observe too the continuous spinning of the thread and the structure of the web."'
  attribution: IV.40 (trans. George Long)
- id: stoics-marcus-aurelius-2
  text: '"How small a part of the boundless and unfathomable time is assigned to every man! For it is very soon swallowed up in the eternal. And how small a part of the whole substance! And how small a part of the universal soul! And on what a small clod of the whole earth you creep! Reflecting on all this, consider nothing to be great, except to act as your nature leads you, and to endure that which the common nature brings."'
  attribution: V.24
- id: stoics-marcus-aurelius-3
  text: "\"Think of the life you have lived until now as over and, as a dead man, see what's left as a bonus and live it according to Nature. Love the hand that fate deals you and play it as your own, for what could be more fitting?\""
  attribution: VII.56
- id: stoics-marcus-aurelius-4
  text: '"You have power over your mind, not outside events. Realize this, and you will find strength."'
  attribution: (attributed, paraphrasing XII.22)
- id: stoics-marcus-aurelius-5
  text: '"If you are distressed by anything external, the pain is not due to the thing itself, but to your estimate of it; and this you have the power to revoke at any moment."'
  attribution: VIII.47
- id: stoics-marcus-aurelius-6
  text: '"The impediment to action advances action. What stands in the way becomes the way."'
  attribution: V.20 (trans. Ryan Holiday)
- id: stoics-epictetus-1
  text: '"Some things are within our power, while others are not. Within our power are opinion, motivation, desire, aversion, and, in a word, whatever is of our own doing. Not within our power are our body, our property, reputation, office, and, in a word, whatever is not of our own doing. The things in our power are by nature free, unhindered, and unimpeded; the things not in our power are weak, slavish, hindered, and dependent on others."'
  attribution: "*Enchiridion*, Ch. 1 (trans. Elizabeth Carter, adapted)"
- id: stoics-epictetus-2
  text: '"Seek not that the things which happen should happen as you wish; but wish the things which happen to be as they are, and you will have a tranquil flow of life."'
  attribution: "*Enchiridion*, Ch. 8"
- id: stoics-epictetus-3
  text: "\"Never say about anything, 'I have lost it,' but 'I have restored it.' Is your child dead? It has been restored. Is your wife dead? She has been restored. 'I have had my farm taken away.' That too has been restored. 'But he who took it away is a bad man.' What is it to you by whose hands the Giver demanded it back?\""
  attribution: "*Enchiridion*, Ch. 11"
- id: stoics-epictetus-4
  text: '"Men are disturbed not by the things which happen, but by the opinions about the things: for example, death is nothing terrible, for if it were, it would have seemed so to Socrates; for the opinion about death, that it is terrible, is the terrible thing."'
  attribution: "*Enchiridion*, Ch. 5"
- id: stoics-seneca-1
  text: "\"It is not that we have a short time to live, but that we waste a great deal of it. Life is long enough, and a sufficiently generous amount has been given to us for the highest achievements if it were all well invested. But when it is wasted in heedless luxury and spent on no good activity, we are forced at last by death's final constraint to realize that it has passed away before we knew it was passing.\""
  attribution: "*On the Shortness of Life*, 1 (trans. C.D.N. Costa)"
- id: stoics-seneca-2
  text: '"Gather and save the time which till lately has been forced from you, or filched away, or has merely slipped from your hands. Make yourself believe the truth of my words: that certain moments are torn from us, that some are gently removed, and that others glide beyond our reach. The most disgraceful kind of loss, however, is that due to carelessness."'
  attribution: "*Letters to Lucilius*, I.1 (trans. Richard Gummere, adapted)"
- id: stoics-seneca-3
  text: '"We suffer more in imagination than in reality."'
  attribution: "*Letters to Lucilius*, XIII.4"
- id: stoics-seneca-4
  text: "\"If you shape your life according to nature, you will never be poor; if according to people's opinions, you will never be rich.\""
  attribution: "*Letters to Lucilius*, XVI.7"
- id: stoics-seneca-5
  text: '"Omnia, Lucili, aliena sunt, tempus tantum nostrum est. — Everything, Lucilius, belongs to others; time alone is ours."'
  attribution: "*Letters to Lucilius*, I.1"
