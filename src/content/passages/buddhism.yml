- id: buddhism-dhammapada-1
  text: '"We are what we think. All that we are arises with our thoughts. With our thoughts we make the world. Speak or act with an impure mind and trouble will follow you as the wheel follows the ox that draws the cart. Speak or act with a pure mind and happiness will follow you as a shadow that never departs."'
  attribution: Verses 1–2 (trans. Thomas Byrom)
- id: buddhism-dhammapada-2
  text: '"Hatred does not cease by hatred at any time. Hatred ceases by love. This is an unalterable law."'
  attribution: Verse 5
- id: buddhism-dhammapada-3
  text: '"More than those who hate you, more than all your enemies, an undisciplined mind does greater harm."'
  attribution: Verse 42
- id: buddhism-dhammapada-4
  text: '"Just as a solid rock is not shaken by the storm, even so the wise are not affected by praise or blame."'
  attribution: Verse 81
- id: buddhism-dhammapada-5
  text: '"If you find a wise critic to point out your faults, follow him as you would a guide to hidden treasure."'
  attribution: Verse 76
- id: buddhism-dhammapada-6
  text: '"All conditioned things are impermanent. When one sees this with wisdom, one turns away from suffering. This is the path to purification."'
  attribution: Verse 277
- id: buddhism-heart-sutra-1
  text: '"Avalokiteshvara Bodhisattva, when practicing deeply the Prajna Paramita, perceived that all five aggregates in their own being are empty and was saved from all suffering. O Shariputra, form does not differ from emptiness; emptiness does not differ from form. That which is form is emptiness, that which is emptiness form. The same is true of feelings, perceptions, mental formations, and consciousness."'
  attribution: (trans. Zen Center of Los Angeles)
- id: buddhism-heart-sutra-2
  text: '"O Shariputra, all dharmas are marked with emptiness. They do not appear or disappear, are not tainted or pure, do not increase or decrease. Therefore in emptiness: no form, no feelings, no perceptions, no mental formations, no consciousness. No eyes, no ears, no nose, no tongue, no body, no mind. No form, no sound, no smell, no taste, no touch, no object of mind. No realm of eyes... No ignorance and also no extinction of it... No suffering, no origination, no stopping, no path. No cognition and also no attainment."'
  attribution: (trans. Thich Nhat Hanh)
- id: buddhism-heart-sutra-3
  text: |-
    "Gone, gone, gone beyond, gone completely beyond. Awakening! So be it.
    *Gate gate pāragate pārasaṃgate bodhi svāhā.*"
  attribution: Closing mantra of the Heart Sutra
- id: buddhism-kalama-sutta-1
  text: "\"Do not go upon what has been acquired by repeated hearing. Do not go upon tradition. Do not go upon rumor. Do not go upon what is in a scripture. Do not go upon surmise. Do not go upon an axiom. Do not go upon specious reasoning. Do not go upon a bias toward a notion that has been pondered over. Do not go upon another's seeming ability. Do not go upon the consideration that 'The monk is our teacher.'\""
  attribution: (trans. Soma Thera)
- id: buddhism-kalama-sutta-2
  text: |-
    "But when you yourselves know: 'These things are bad; these things are blamable; these things are censured by the wise; undertaken and observed, these things lead to harm and ill' — abandon them.

    When you yourselves know: 'These things are good; these things are not blamable; these things are praised by the wise; undertaken and observed, these things lead to benefit and happiness' — enter on and abide in them."
  attribution: (trans. Soma Thera)
- id: buddhism-kalama-sutta-3
  text: '"When greed arises, it arises for the harm of oneself, for the harm of others, for the harm of both. When there is no greed, it is for the welfare of oneself, for the welfare of others, for the welfare of both. This is one thing that, when seen with wisdom, gives rise to the abandonment of greed."'
  attribution: (from the fuller text)
