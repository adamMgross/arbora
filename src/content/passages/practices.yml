- id: practices-the-morning-cup-1
  text: '"In the tea room it is enough to cleanse the flower vases, light the charcoal and arrange the flowers, create coolness in summer and warmth in winter."'
  attribution: Sen Rikyu (1522–1591), the great systematizer of the Japanese tea ceremony
- id: practices-the-attention-audit-1
  text: '"We have become combatants in the war against our own attention. The technologies that were supposed to free us have instead become the most efficient tools ever devised for the distraction and fragmentation of human consciousness."'
  attribution: adapted from Neil Postman, Technopoly (1992)
- id: practices-the-attention-audit-2
  text: '"Solitude requires you to move past reacting to information created by other people and focus instead on your own thoughts and experiences — this is a fundamental human need."'
  attribution: Cal Newport, Digital Minimalism (2019)
