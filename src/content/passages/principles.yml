- id: principles-source-traditions-1
  text: '"When this exists, that comes to be; with the arising of this, that arises. When this does not exist, that does not come to be; with the cessation of this, that ceases."'
  attribution: The Buddha, *Majjhima Nikaya* 115
- id: principles-source-traditions-2
  text: '"A bay is a noun only if water is dead. When bay is a verb, it is alive... To be a hill, to be a sandy beach, to be a Saturday, all are possible verbs in a world where everything is alive."'
  attribution: Robin Wall Kimmerer, *Braiding Sweetgrass*
- id: principles-source-traditions-3
  text: '"Constantly regard the universe as one living being, having one substance and one soul; and observe how all things have reference to one perception, the perception of this one living being."'
  attribution: Marcus Aurelius, *Meditations* IV.40
- id: principles-source-traditions-4
  text: "\"Think of the life you have lived until now as over and, as a dead man, see what's left as a bonus and live it according to Nature. Love the hand that fate deals you and play it as your own, for what could be more fitting?\""
  attribution: Marcus Aurelius, *Meditations* VII.56
- id: principles-source-traditions-5
  text: '"All conditioned things are impermanent. When one sees this with wisdom, one turns away from suffering."'
  attribution: "*Dhammapada*, verse 277"
- id: principles-source-traditions-6
  text: '"The summit of Mt. Everest is marine limestone... This is the kind of observation that makes geologists rapt and a little bit wild."'
  attribution: John McPhee, *Annals of the Former World*
- id: principles-source-traditions-7
  text: '"More than those who hate you, more than all your enemies, an undisciplined mind does greater harm."'
  attribution: "*Dhammapada*, verse 42"
- id: principles-source-traditions-8
  text: '"Sit and forget. Let your limbs and body fall away, drive out perception and intellect, cast off form, do away with understanding, and make yourself identical with the Great Thoroughfare."'
  attribution: Zhuangzi, Chapter 6
- id: principles-source-traditions-9
  text: '"If you are distressed by anything external, the pain is not due to the thing itself, but to your estimate of it; and this you have the power to revoke at any moment."'
  attribution: Marcus Aurelius, *Meditations* VIII.47
- id: principles-source-traditions-10
  text: '"Know the ways of the ones who take care of you, so that you may take care of them. Introduce yourself. Be accountable as the one who comes asking for life. Ask permission before taking. Abide by the answer. Never take the first. Never take the last."'
  attribution: Robin Wall Kimmerer, *Braiding Sweetgrass*, "The Honorable Harvest"
- id: principles-source-traditions-11
  text: '"If beings knew, as I know, the results of giving and sharing, they would not eat without having given."'
  attribution: The Buddha, *Itivuttaka* 26
- id: principles-source-traditions-12
  text: '"Justice is nothing other than the love of the wise, that is, love acting according to wisdom, directed above all to the common good."'
  attribution: Seneca, paraphrased from *Letters to Lucilius*
- id: principles-source-traditions-13
  text: '"It is not upon you to finish the work, but neither are you free to desist from it."'
  attribution: Rabbi Tarfon, *Pirkei Avot* 2:16
- id: principles-source-traditions-14
  text: '"We do not inherit the earth from our ancestors; we borrow it from our children."'
  attribution: Attributed to indigenous teaching, widely cited
- id: principles-source-traditions-15
  text: '"To forget your ancestors is to be a brook without a source, a tree without a root."'
  attribution: Chinese proverb
- id: principles-source-traditions-16
  text: '"If I am not for myself, who will be for me? But if I am only for myself, what am I? And if not now, when?"'
  attribution: Hillel the Elder, *Pirkei Avot* 1:14
- id: principles-source-traditions-17
  text: '"What would you think of a person who could cure the illness of loneliness and chose not to?"'
  attribution: Sebastian Junger, *Tribe*
- id: principles-source-traditions-18
  text: '"Thousands of candles can be lighted from a single candle, and the life of the candle will not be shortened. Happiness never decreases by being shared."'
  attribution: Attributed traditional Buddhist verse
- id: principles-source-traditions-19
  text: '"Do not accept anything by mere tradition... Do not accept anything just because it accords with your scriptures... Do not accept anything merely because it agrees with your pre-conceived notions... But when you know for yourselves that certain things are wholesome and good, then accept them and live up to them."'
  attribution: The Buddha, *Kalama Sutta* (AN 3.65)
- id: principles-source-traditions-20
  text: '"Who is wise? One who learns from every person. Who is mighty? One who subdues their own inclination. Who is rich? One who is happy with their lot."'
  attribution: Ben Zoma, *Pirkei Avot* 4:1
- id: principles-source-traditions-21
  text: '"I know that I know nothing."'
  attribution: Socrates, as reported by Plato in the *Apology*
- id: principles-source-traditions-22
  text: '"The Tao that can be told is not the eternal Tao. The name that can be named is not the eternal name. The nameless is the beginning of heaven and earth."'
  attribution: Lao Tzu, *Tao Te Ching*, Chapter 1 (trans. Gia-Fu Feng & Jane English)
- id: principles-source-traditions-23
  text: "\"If I spend all my time with creatures, this follows me and drags me down. Even the idea of God can drag me down... But in the breakthrough, where I become free of the will of God and of all God's works, there I am above all creatures and am neither God nor creature.\""
  attribution: Meister Eckhart, Sermon 52
- id: principles-source-traditions-24
  text: '"You are not a drop in the ocean. You are the entire ocean in a drop."'
  attribution: Rumi
