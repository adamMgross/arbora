- id: daoism-tao-te-ching-1
  text: |-
    "The Tao that can be told is not the eternal Tao.
    The name that can be named is not the eternal name.
    The nameless is the beginning of heaven and earth.
    The named is the mother of ten thousand things."
  attribution: Chapter 1 (trans. Gia-Fu Feng & Jane English)
- id: daoism-tao-te-ching-2
  text: |-
    "The Tao gives birth to One.
    One gives birth to Two.
    Two gives birth to Three.
    Three gives birth to ten thousand things.
    The ten thousand things carry yin and embrace yang.
    They achieve harmony by combining these forces."
  attribution: Chapter 42
- id: daoism-tao-te-ching-3
  text: |-
    "Attain the utmost emptiness; hold fast to stillness.
    The ten thousand things stir about;
    I only watch for their going back.
    Things flourish and each returns to its root.
    Returning to the root is called stillness.
    Stillness is the return to one's destiny."
  attribution: Chapter 16
- id: daoism-tao-te-ching-4
  text: |-
    "Knowing others is wisdom.
    Knowing yourself is enlightenment.
    Mastering others requires force.
    Mastering yourself requires strength."
  attribution: Chapter 33
- id: daoism-tao-te-ching-5
  text: |-
    "A man is born gentle and weak.
    At his death he is hard and stiff.
    Green plants are tender and filled with sap.
    At their death they are withered and dry.
    Therefore the stiff and unbending is the disciple of death.
    The gentle and yielding is the disciple of life."
  attribution: Chapter 76
- id: daoism-tao-te-ching-6
  text: |-
    "In the pursuit of learning, every day something is acquired.
    In the pursuit of Tao, every day something is dropped.
    Less and less is done until non-action is achieved.
    When nothing is done, nothing is left undone."
  attribution: Chapter 48
- id: daoism-tao-te-ching-7
  text: |-
    "The great Tao flows everywhere, both to the left and to the right.
    The ten thousand things depend upon it; it holds nothing back.
    It fulfills its purpose silently and makes no claim."
  attribution: Chapter 34
- id: daoism-zhuangzi-1
  text: '"Once upon a time, I, Chuang Tzu, dreamt I was a butterfly, fluttering hither and thither, to all intents and purposes a butterfly, unaware that I was Chuang Tzu. Suddenly I awoke and lay there, Chuang Tzu once more. Now I do not know whether I was then a man dreaming I was a butterfly, or whether I am now a butterfly dreaming I am a man. Between a man and a butterfly there is necessarily a barrier. The transition is called metempsychosis."'
  attribution: Chapter 2, "Discussion on Making All Things Equal" (trans. Herbert Giles)
- id: daoism-zhuangzi-2
  text: "\"Prince Hui's cook was cutting up a bullock... After three years' practice, he saw no more whole animals. And now I work with my mind and not with my eye. My mind works along without the control of the senses. Falling back upon eternal principles, I glide through such great joints or cavities as there may be, according to the natural constitution of the animal... A good cook changes his chopper once a year — because he cuts. An ordinary cook, once a month — because he hacks. But I have had this chopper for nineteen years, and its edge is as keen as if fresh from the grindstone. There are spaces in the joints; the edge of a chopper has no thickness; to insert that which has no thickness into such spaces — there is plenty of room for the blade to move along.\""
  attribution: Chapter 3, "Nourishing the Lord of Life" (trans. James Legge, adapted)
- id: daoism-zhuangzi-3
  text: "\"When the shoe fits, the foot is forgotten. When the belt fits, the belly is forgotten. When the heart is right, 'for' and 'against' are forgotten.\""
  attribution: Chapter 19 (trans. Thomas Merton)
- id: daoism-zhuangzi-4
  text: '"Flow with whatever may happen and let your mind be free. Stay centered by accepting whatever you are doing. This is the ultimate."'
  attribution: Chapter 4 (trans. Gia-Fu Feng & Jane English)
- id: daoism-zhuangzi-5
  text: '"The perfect man has no self. The spirit man has no merit. The sage has no reputation."'
  attribution: Chapter 1
