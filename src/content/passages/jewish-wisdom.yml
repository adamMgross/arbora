- id: jewish-wisdom-pirkei-avot-1
  text: '"If I am not for myself, who will be for me? But if I am only for myself, what am I? And if not now, when?"'
  attribution: Hillel the Elder, 1:14
- id: jewish-wisdom-pirkei-avot-2
  text: '"In a place where there are no people, strive to be a person."'
  attribution: Hillel the Elder, 2:6
- id: jewish-wisdom-pirkei-avot-3
  text: '"It is not upon you to finish the work, but neither are you free to desist from it."'
  attribution: Rabbi Tarfon, 2:16
- id: jewish-wisdom-pirkei-avot-4
  text: '"Who is wise? One who learns from every person. Who is strong? One who masters their own impulses. Who is rich? One who is satisfied with their portion. Who is honored? One who honors others."'
  attribution: Ben Zoma, 4:1
- id: jewish-wisdom-pirkei-avot-5
  text: '"Do not judge your fellow until you have reached their place."'
  attribution: Hillel the Elder, 2:5
- id: jewish-wisdom-pirkei-avot-6
  text: '"Turn it over and turn it over, for everything is in it. See into it, grow old in it, waste not a moment from it — for there is no better measure."'
  attribution: Ben Bag-Bag, 5:22
- id: jewish-wisdom-pirkei-avot-7
  text: '"Do not be sure of yourself until the day of your death."'
  attribution: Hillel the Elder, 2:5
- id: jewish-wisdom-pirkei-avot-8
  text: '"The world stands on three things: on Torah, on service, and on acts of loving-kindness."'
  attribution: Shimon the Just, 1:2
- id: jewish-wisdom-ecclesiastes-1
  text: '"Vanity of vanities! All is vanity. What profit does man have for all his labor under the sun? One generation passes away and another comes, but the earth abides forever. The sun also rises and the sun goes down, and hastens to its place where it arose. The wind goes toward the south and turns around to the north; it whirls about continually, and the wind returns again according to its circuits. All the rivers run into the sea, yet the sea is not full; to the place from which the rivers come, there they return again."'
  attribution: 1:2–7
- id: jewish-wisdom-ecclesiastes-2
  text: '"To every thing there is a season, and a time to every purpose under the heaven: a time to be born, and a time to die; a time to plant, and a time to pluck up that which is planted; a time to kill, and a time to heal; a time to break down, and a time to build up; a time to weep, and a time to laugh; a time to mourn, and a time to dance."'
  attribution: 3:1–4
- id: jewish-wisdom-ecclesiastes-3
  text: '"What is crooked cannot be made straight, and what is lacking cannot be numbered."'
  attribution: 1:15
- id: jewish-wisdom-ecclesiastes-4
  text: '"There is no remembrance of former things, nor will there be any remembrance of things that are to come with those who come after."'
  attribution: 1:11
- id: jewish-wisdom-ecclesiastes-5
  text: '"Go, eat your bread with joy, and drink your wine with a merry heart, for God has already approved what you do. Let your garments be always white. Let not oil be lacking on your head. Enjoy life with the wife whom you love, all the days of your vain life that he has given you under the sun, because that is your portion in life."'
  attribution: 9:7–9
- id: jewish-wisdom-ecclesiastes-6
  text: '"Whatever your hand finds to do, do it with your might, for there is no work or thought or knowledge or wisdom in the grave, to which you are going."'
  attribution: 9:10
