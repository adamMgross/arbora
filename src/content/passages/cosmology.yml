- id: cosmology-indra-s-net-and-the-wheel-of-becoming-1
  text: '"In the heaven of Indra, there is said to be a network of pearls so arranged that if you look at one you see all the others reflected in it. In the same way, each object in the world is not merely itself but involves every other object, and in fact is everything else."'
  attribution: "*Avatamsaka Sutra*, as described by Sir Charles Eliot"
- id: cosmology-the-tao-and-the-ten-thousand-things-1
  text: '"The Tao that can be told is not the eternal Tao. The name that can be named is not the eternal name. The nameless is the beginning of heaven and earth. The named is the mother of ten thousand things."'
  attribution: Lao Tzu, *Tao Te Ching*, Chapter 1 (trans. Gia-Fu Feng & Jane English)
- id: cosmology-the-tao-and-the-ten-thousand-things-2
  text: '"The Tao gives birth to one. One gives birth to two. Two gives birth to three. Three gives birth to ten thousand things. The ten thousand things carry yin and embrace yang. They achieve harmony by combining these forces."'
  attribution: Lao Tzu, *Tao Te Ching*, Chapter 42
- id: cosmology-sky-woman-and-turtle-island-1
  text: '"In the beginning was the Skyworld. And in the Skyworld there was a great tree... The woman fell and fell, through the darkness, toward the water below. But the geese saw her coming and flew up to catch her on their wings."'
  attribution: Haudenosaunee oral tradition, as recounted by Robin Wall Kimmerer, *Braiding Sweetgrass*
- id: cosmology-the-forest-that-holds-up-the-sky-1
  text: '"The white people do not dream as far as we do. They sleep a lot but only dream about themselves. Their thought remains blocked and they sleep like tapirs or tortoises. That is why they cannot understand our words."'
  attribution: "Davi Kopenawa, *The Falling Sky: Words of a Yanomami Shaman*"
- id: cosmology-the-dreaming-1
  text: "\"We don't own the land, the land owns us. The land is my mother, my mother is the land... Land is the starting point to where it all began. It is like picking up a piece of the earth and holding it — this is who I am, this is what I stand for.\""
  attribution: Traditional Aboriginal teaching, as expressed by Djinyini Gondarra
- id: cosmology-te-kore-te-p-333-te-ao-m-257-rama-1
  text: |-
    "From the conception the increase,
    From the increase the thought,
    From the thought the remembrance,
    From the remembrance the consciousness,
    From the consciousness the desire."
  attribution: Maori cosmogonic chant, *Te Kore* sequence
- id: cosmology-yggdrasil-and-the-well-of-memory-1
  text: |-
    "I know that I hung on a windy tree,
    nine full nights,
    wounded with a spear, and given to Odin,
    myself to myself,
    on that tree of which no one knows
    from what roots it runs."
  attribution: "*Hávamál*, stanza 138, *Poetic Edda*"
- id: cosmology-ein-sof-and-the-tree-of-life-1
  text: '"When God began to create, the divine light radiated through the sefirot like water flowing through channels. But the vessels could not contain the light, and they shattered, and sparks of holiness fell into everything that exists."'
  attribution: Based on Isaac Luria's account of *shevirat ha-kelim*, 16th century Safed
- id: cosmology-the-breath-of-the-compassionate-1
  text: '"I am not this hair, I am not this skin, I am the soul that lives within. I have lived on the lip of insanity, wanting to know reasons, knocking on a door. It opens. I have been knocking from the inside."'
  attribution: Rumi, trans. Coleman Barks
- id: cosmology-the-breath-of-the-compassionate-2
  text: '"I was a hidden treasure and I loved to be known, so I created the world that I might be known."'
  attribution: "*Hadith qudsi*, widely cited in Sufi tradition"
- id: cosmology-the-book-of-creation-1
  text: '"Praised be You, my Lord, through Sister Mother Earth, who sustains and governs us, and who produces various fruits with colored flowers and herbs."'
  attribution: Francis of Assisi, *Canticle of the Creatures*, c. 1225
- id: cosmology-the-book-of-creation-2
  text: '"God is creating the entire world, fully and totally, in this present now. Everything God created six thousand years ago — and even previous to that — God creates now all at once."'
  attribution: Meister Eckhart, Sermon 10
- id: cosmology-non-duality-1
  text: "\"The eye through which I see God is the same eye through which God sees me; my eye and God's eye are one eye, one seeing, one knowing, one love.\""
  attribution: Meister Eckhart, Sermon 12
- id: cosmology-process-over-substance-1
  text: '"No man ever steps in the same river twice, for it is not the same river, and he is not the same man."'
  attribution: Heraclitus, Fragment 12
- id: cosmology-change-as-fundamental-1
  text: '"All conditioned things are impermanent. When one sees this with wisdom, one turns away from suffering."'
  attribution: "*Dhammapada*, verse 277"
