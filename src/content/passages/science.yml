- id: science-simard-1
  text: '"The Mother Trees were the biggest, oldest trees in the forest, and they were connected to all the other trees around them through the mycorrhizal network. They were sending carbon and nutrients and water to the younger trees. They were nurturing their offspring, and they were sharing information about danger. The forest was behaving as though it were a single organism."'
  attribution: Suzanne Simard, *Finding the Mother Tree* (2021)
- id: science-wohlleben-1
  text: '"When trees grow together, nutrients and water can be shared through the underground network. This means that individual trees do not simply compete with each other. They work together. A tree is not a tree in isolation. It is a member of a community... Trees in a forest care for each other, sometimes even going so far as to nourish the stump of a felled tree for centuries after it was cut down."'
  attribution: Peter Wohlleben, *The Hidden Life of Trees* (2015)
- id: science-mcphee-1
  text: '"The summit of Mt. Everest is marine limestone. This is the kind of observation that makes geologists rapt and a little bit wild. If you were to go to the top of Mt. Everest, you would find the fossilized remains of sea creatures in the rock beneath your feet. The Himalayas are the seafloor, lifted seven miles into the air."'
  attribution: John McPhee, *Annals of the Former World* (1998)
- id: science-mcphee-2
  text: "\"In geologic time, a human lifetime is reduced to a brevity that is too inhibiting to think about deep in the night... A day is a millionth of a human lifetime, but it is a billionth of a river's.\""
  attribution: John McPhee, *Basin and Range*
- id: science-mancuso-1
  text: '"Plants are able to sense and calculate their environment with a precision that is the envy of the most gifted animals. They can sense gravity, electromagnetic fields, humidity, light, chemicals, temperature gradients, and even sounds. They make decisions. The root system of a single plant may make millions of computations per second as it navigates through soil."'
  attribution: Stefano Mancuso, *The Revolutionary Genius of Plants* (2017)
- id: science-darwin-1
  text: '"There is grandeur in this view of life, with its several powers, having been originally breathed into a few forms or into one; and that, whilst this planet has gone cycling on according to the fixed law of gravity, from so simple a beginning endless forms most beautiful and most wonderful have been, and are being, evolved."'
  attribution: Charles Darwin, *On the Origin of Species* (1859)
- id: science-carson-1
  text: '"In nature nothing exists alone. Every living thing exists in relation to every other living thing — the web of life in which there is no single strand that can be touched without the vibration being felt throughout the entire web."'
  attribution: Rachel Carson, *Silent Spring* (1962)
