- id: today
  seasonGreetings:
    spring: The world is waking. So may you.
    summer: The light is long. The mountains are open.
    autumn: The year is turning. Hold it lightly.
    winter: The roots are working beneath the frozen ground.
  morningInvocations:
    - I woke today because others endured before me — through crossings I cannot imagine, in languages I no longer speak. I carry their survival in my body. This morning, with this tea, I remember them.
    - The trees on my street were here before I was and may outlast me. The nearest park is exhaling right now, and I am breathing what the trees give. I am not separate from this neighborhood. I am a neighbor to all of it.
    - This person beside me, this animal against my leg — they will not always be here, and neither will I. Let me not miss this morning by thinking about the afternoon. Let me be fully where I am, with whom I am.
    - The sun that warms this morning has risen over this place for four and a half billion years. The hills I see were seafloor once. The tea in my hands grew from soil that was stone, that was magma, that was stardust. I am a brief visitor in an ancient story. That is enough.
    - What season is it — not on the calendar, but in the world? What is blooming, what is dormant, what is migrating through? Let me notice the light, the temperature, the angle of the sun. My body knows what time it is if I let it.
    - "I have already received today: warmth, breath, this cup, this company. Before the day asks anything of me, let me ask what I will give back. Not out of guilt, but because exchange is how living systems endure."
    - I do not understand why anything exists at all. I do not understand consciousness, or love, or why the light at this hour turns everything gold. I do not need to understand. Let me begin this day in honest amazement.
    - There are countless things I could attend to today — worries that are not mine, noise that asks only to be amplified. What I give my attention to, I become. Let me choose carefully what this morning is for.
    - I have never lived this day before and will never live it again. Whatever I think I know about how it will go, I do not. The mind that arrives at this morning without conclusions is the mind that can actually see it. Let me begin as a beginner.
    - The river does not decide to reach the sea. The tree does not plan to grow toward light. There is a grain to things, and when I work with it, more is accomplished than when I strain against it. Today, let me notice the grain before I push.
    - The iron in my blood was forged in a star that died before the sun was born. The calcium in my bones came from ancient seas. This body is assembled from the oldest events in the cosmos. I am not just alive — I am borrowed from deep time.
    - "Zhuangzi’s cook did not cut the ox — he found the spaces already there and moved through them. The best work finds the grain of the material and follows it. Let me approach this day’s labor with that kind of attention: not forcing, but following."
    - The Stoics called it prosoche — attention to your own impulses and judgments before the day’s noise arrives. What am I bringing to this morning? What mood arrived with me before I chose it? Let me notice the interior weather before I step into the world.
    - Before the day asks anything of me, let me notice what it is already doing. The trees are already working. The birds have already begun. The light has been moving since before I woke. I arrive, as usual, late to what is already underway.
    - This cup came from the other side of the world — from soil and rain and hands I will never know, from a tradition thousands of years old. Let me drink it slowly enough to remember that. The morning cup is a small altar. The attention I bring to it is the practice.
    - The tree outside my window does not know it is in a city. The crow on the wire does not know about the freeway. I am surrounded by lives that are completely indifferent to my schedule. Let me be glad of that. The world does not need my permission to be alive.
    - I am not in the mountains today. But the mountains are still there, doing what they always do — rising imperceptibly, being patient beyond my comprehension, holding the watershed that feeds everything downstream. I carry a piece of that patience with me. Let me use it.
    - This world was built through collaboration — the geese who caught the falling woman, the turtle who offered its back, the muskrat who dove to the bottom. Every morning I wake into the continuation of that gift. What was given to me, I did not earn. Let me pass it on.
    - The ancestors who gave me this life did not give it to me to spend in distraction. This morning, this tea, this light — this is the inheritance. Somewhere in the old country, someone woke into a morning far harder than this and chose to continue. I continue in their name.
  readings:
    - text: Constantly regard the universe as one living being, having one substance and one soul; and observe how all things have reference to one perception, the perception of this one living being; and how all things act with one movement; and how all things are the cooperating causes of all things that exist; observe too the continuous spinning of the thread and the structure of the web.
      source: Marcus Aurelius, Meditations IV.40
      tradition: stoics
    - text: Once upon a time, I, Chuang Tzu, dreamt I was a butterfly, fluttering hither and thither, to all intents and purposes a butterfly, unaware that I was Chuang Tzu. Suddenly I awoke and lay there, Chuang Tzu once more. Now I do not know whether I was then a man dreaming I was a butterfly, or whether I am now a butterfly dreaming I am a man.
      source: Zhuangzi, Ch. 2 (trans. James Legge)
      tradition: daoism
    - text: We are what we think. All that we are arises with our thoughts. With our thoughts we make the world. Speak or act with an impure mind and trouble will follow you as the wheel follows the ox that draws the cart. Speak or act with a pure mind and happiness will follow you as a shadow that never departs.
      source: Dhammapada, verses 1–2 (trans. Thomas Byrom)
      tradition: buddhism
    - text: It is not that I have little time, but that I waste much of it. Life is long enough, and a sufficiently generous amount has been given to us for the highest achievements if it were all well invested. But when it is wasted in heedless luxury and spent on no good activity, we are forced at last by death’s final constraint to realize that it has passed away before we knew it was passing.
      source: Seneca, On the Shortness of Life I.1
      tradition: stoics
    - text: "Do not go by what you have heard; do not go by tradition; do not go by what is in scripture; do not go by logical inference; do not go by appearances; do not go by the thought “this is our teacher.” But when you yourselves know: “These things are unwholesome, blameworthy, censured by the wise” — then abandon them. And when you know: “These things are wholesome, blameless, praised by the wise; when practiced they lead to welfare and happiness” — then take them up."
      source: Kalama Sutta, Anguttara Nikaya 3.65
      tradition: buddhism
    - text: "To every thing there is a season, and a time to every purpose under the heaven: a time to be born, and a time to die; a time to plant, and a time to pluck up that which is planted; a time to kill, and a time to heal; a time to break down, and a time to build up; a time to weep, and a time to laugh; a time to mourn, and a time to dance."
      source: Ecclesiastes 3:1–4
      tradition: jewish-wisdom
    - text: Nature loves to hide.
      source: Heraclitus, Fragment 123 (c. 500 BCE)
      tradition: fragments
    - text: The Tao that can be told is not the eternal Tao. The name that can be named is not the eternal name. The nameless is the beginning of heaven and earth. The named is the mother of ten thousand things.
      source: Lao Tzu, Tao Te Ching Ch. 1
      tradition: daoism
    - text: In the indigenous worldview, a gift is not a commodity but a way of creating relationship. The plant gives to the animal, the animal gives to the earth, the earth gives to the plant. Round and round the gifts go, weaving a web of reciprocity.
      source: Robin Wall Kimmerer, Braiding Sweetgrass
      tradition: companions
    - text: Form is emptiness, emptiness is form. Form does not differ from emptiness; emptiness does not differ from form. Whatever is form, that is emptiness; whatever is emptiness, that is form. The same is true of feelings, perceptions, mental formations, and consciousness.
      source: Heart Sutra (trans. Thich Nhat Hanh)
      tradition: buddhism
    - text: Seek not that the things which happen should happen as you wish; but wish the things which happen to be as they are, and you will have a tranquil flow of life.
      source: Epictetus, Enchiridion Ch. 8
      tradition: stoics
    - text: "“Bring me a fruit from the banyan tree.” — “Here it is, sir.” — “Break it.” — “What do you see?” — “Some very small seeds.” — “Break one of them. What do you see?” — “Nothing, sir.” The father said: “From that subtle essence which you do not see, this great banyan tree has grown. That which is the subtle essence — in that have all things their existence. That is the truth. That is the Self. And you, Shvetaketu, are that.”"
      source: Chandogya Upanishad 6.12
      tradition: upanishads
    - text: If I am not for myself, who will be for me? But if I am only for myself, what am I? And if not now, when?
      source: Hillel the Elder, Pirkei Avot 1:14
      tradition: jewish-wisdom
    - text: Even after all this time the sun never says to the earth, “You owe me.” Look what happens with a love like that — it lights the whole sky.
      source: Hafiz (trans. Daniel Ladinsky)
      tradition: mystics
    - text: My mind works along without the control of the senses. Falling back upon eternal principles, I glide through the great joints and cavities as they exist, according to the natural constitution of the animal. A good cook changes his chopper once a year — because he cuts. An ordinary cook, once a month — because he hacks. But I have had this chopper for nineteen years, and its edge is as keen as if fresh from the grindstone. There are spaces in the joints; the edge of a chopper has no thickness; to insert that which has no thickness into such spaces — there is plenty of room.
      source: Zhuangzi, Ch. 3 (trans. James Legge, adapted)
      tradition: daoism
    - text: This being human is a guest house. Every morning a new arrival. A joy, a depression, a meanness, some momentary awareness comes as an unexpected visitor. Welcome and entertain them all!
      source: Rumi, “The Guest House”
      tradition: mystics
    - text: If the only prayer you ever say in your entire life is “thank you,” that will be enough.
      source: Meister Eckhart
      tradition: mystics
    - text: One generation passes away, and another generation comes, but the earth abides forever. The sun also rises, and the sun goes down, and hastens to its place where it arose. The wind goes toward the south, and turns around to the north; it whirls about continually, and the wind returns again according to its circuits. All the rivers run into the sea, yet the sea is not full; to the place from which the rivers come, there they return again.
      source: Ecclesiastes 1:4–7
      tradition: jewish-wisdom
    - text: Who is wise? One who learns from every person. Who is strong? One who masters their own impulses. Who is rich? One who is satisfied with their portion. Who is honored? One who honors others.
      source: Ben Zoma, Pirkei Avot 4:1
      tradition: jewish-wisdom
    - text: The way up and the way down are one and the same.
      source: Heraclitus, Fragment 60 (c. 500 BCE)
      tradition: fragments
    - text: Attain the utmost emptiness; hold fast to stillness. The ten thousand things stir about; I only watch for their going back. Things flourish and each returns to its root. Returning to the root is called stillness. Stillness is the return to one’s destiny.
      source: Lao Tzu, Tao Te Ching Ch. 16
      tradition: daoism
    - text: Hatred does not cease by hatred at any time. Hatred ceases by love. This is an unalterable law.
      source: Dhammapada, verse 5
      tradition: buddhism
    - text: "Gather and save the time which till lately has been forced from you, or filched away, or has merely slipped from your hands. Make yourself believe the truth of my words: that certain moments are torn from us, that some are gently removed, and that others glide beyond our reach. The most disgraceful kind of loss, however, is that due to carelessness."
      source: Seneca, Letters to Lucilius I.1
      tradition: stoics
    - text: What the mind cannot think, but by which the mind thinks — know that alone as Brahman. What the eye cannot see, but by which the eye sees — know that alone as Brahman. What the ear cannot hear, but by which the ear hears — know that alone as Brahman.
      source: Kena Upanishad 1.5–7
      tradition: upanishads
    - text: Some things are within our power, while others are not. Within our power are opinion, motivation, desire, aversion, and, in a word, whatever is of our own doing.
      source: Epictetus, Enchiridion Ch. 1
      tradition: stoics
    - text: "Cattle die, kindred die, every man is mortal. I know one thing that does not die: the good name of one who has done well."
      source: Hávamál, stanzas 76–77 (Norse, c. 9th century)
      tradition: fragments
    - text: No man ever steps in the same river twice, for it is not the same river and he is not the same man.
      source: Heraclitus, Fragment 12
      tradition: fragments
    - text: A man is born gentle and weak. At his death he is hard and stiff. Green plants are tender and filled with sap. At their death they are withered and dry. Therefore the stiff and unbending is the disciple of death. The gentle and yielding is the disciple of life.
      source: Lao Tzu, Tao Te Ching Ch. 76
      tradition: daoism
    - text: Are you looking for me? I am in the next seat. My shoulder is against yours. When you really look for me, you will see me instantly — you will find me in the tiniest house of time.
      source: Kabir
      tradition: mystics
    - text: The small man builds cages for everyone he knows. While the sage, who has to duck his head when the moon is low, keeps dropping keys all night long for the beautiful rowdy prisoners.
      source: Hafiz (trans. Daniel Ladinsky)
      tradition: mystics
    - text: From the place where we are right flowers will never grow in the spring. The place where we are right is hard and trampled like a yard. But doubts and loves dig up the world like a mole, a plow.
      source: Yehuda Amichai, “The Place Where We Are Right”
      tradition: ancestral
    - text: All conditioned things are impermanent. When one sees this with wisdom, one turns away from suffering. This is the path to purification.
      source: Dhammapada, verse 277
      tradition: buddhism
    - text: It is not upon you to finish the work, but neither are you free to desist from it.
      source: Rabbi Tarfon, Pirkei Avot 2:16
      tradition: jewish-wisdom
    - text: The eye through which I see God is the same eye through which God sees me; my eye and God’s eye are one eye, one seeing, one knowing, one love.
      source: Meister Eckhart, Sermons
      tradition: mystics
    - text: Praised be You, my Lord, through Brother Wind and through the air, cloudy and serene, and every kind of weather through which You give sustenance to Your creatures. Praised be You, my Lord, through Sister Water, who is very useful and humble and precious and chaste. Praised be You, my Lord, through our Sister, Mother Earth, who sustains and governs us, and produces varied fruits with colored flowers and herbs.
      source: Francis of Assisi, Canticle of the Sun (c. 1225)
      tradition: mystics
    - text: Turn it over and turn it over, for everything is in it. See into it, grow old in it, waste not a moment from it — for there is no better measure.
      source: Ben Bag-Bag, Pirkei Avot 5:22
      tradition: jewish-wisdom
    - text: At fifteen I set my heart on learning. At thirty I stood firm. At forty I had no doubts. At fifty I understood Heaven’s will. At sixty my ear was attuned. At seventy I could follow my heart’s desire without transgressing what was right.
      source: Confucius, Analects 2:4
      tradition: fragments
    - text: In geologic time, a human lifetime is reduced to a brevity that is too inhibiting to think about deep in the night. A day is a millionth of a human lifetime, but it is a billionth of a river’s.
      source: John McPhee, Basin and Range
      tradition: science
    - text: There is grandeur in this view of life, with its several powers, having been originally breathed into a few forms or into one; and that, whilst this planet has gone cycling on according to the fixed law of gravity, from so simple a beginning endless forms most beautiful and most wonderful have been, and are being, evolved.
      source: Charles Darwin, On the Origin of Species (1859)
      tradition: science
    - text: In nature nothing exists alone. Every living thing exists in relation to every other living thing — the web of life in which there is no single strand that can be touched without the vibration being felt throughout the entire web.
      source: Rachel Carson, Silent Spring (1962)
      tradition: science
    - text: The Mother Trees were the biggest, oldest trees in the forest, and they were connected to all the other trees around them through the mycorrhizal network. They were sending carbon and nutrients and water to the younger trees. The forest was behaving as though it were a single organism.
      source: Suzanne Simard, Finding the Mother Tree (2021)
      tradition: science
    - text: |-
        Consider if this is a man,
        Who labours in the mud,
        Who knows no peace,
        Who fights for a crust of bread,
        Who dies at a yes or a no.
        Consider that this has been:
        I commend these words to you.
        Engrave them on your hearts
        When you are in your house, when you walk on your way,
        When you go to bed, when you rise.
      source: Primo Levi, epigraph to If This Is a Man (1947)
      tradition: ancestral
    - text: Just to be is a blessing, just to live is holy.
      source: Abraham Joshua Heschel, Man Is Not Alone
      tradition: jewish-wisdom
    - text: We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts. We are what we repeatedly do. Excellence, then, is not an act, but a habit.
      source: Aristotle, Nicomachean Ethics II.1
      tradition: fragments
    - text: Lead me from the unreal to the real. Lead me from darkness to light. Lead me from death to immortality.
      source: Brihadaranyaka Upanishad 1.3.28
      tradition: upanishads
    - text: All this — whatever moves in this moving world — is enveloped by the Lord. Enjoy what is given up; do not covet what belongs to another. By this giving up, indeed, do you wish to live?
      source: Isha Upanishad 1 (trans. Patrick Olivelle)
      tradition: upanishads
    - text: At every door-way, before you enter, you should look around, you should spy around — for you cannot know where enemies are sitting in the hall before you.
      source: Hávamál, stanza 1 (Norse, Poetic Edda)
      tradition: fragments
    - text: The man who is moderately wise is the best of men; he does not demand too much wisdom. The noblest life is lived by those who know enough.
      source: Hávamál, stanza 54
      tradition: fragments
    - text: We are each called to be a hollow bone — a conduit for the healing and balancing energies that are needed in the world. Our obligation is not to seek our own balance alone, but to restore balance in the places where we live and in the relationships we carry.
      source: Sherri Mitchell (Weh’na Ha’mu Kwasset), Sacred Instructions
      tradition: ancestral
    - text: The secret of tracking is that the tracker has no agenda about where the track is going. They are fully in the present moment, reading only what is in front of them. The question is never ‘What do I want to find?’ but ‘What is here?’
      source: Boyd Varty, Lion Tracker’s Guide to Life
      tradition: companions
    - text: |-
        When despair for the world grows in me
        and I wake in the night at the least sound
        in fear of what my life and my children’s lives may be,
        I go and lie down where the wood drake
        rests in his beauty on the water, and the great heron feeds.
        I come into the peace of wild things.
      source: Wendell Berry, “The Peace of Wild Things”
      tradition: poetry
    - text: |-
        We must uncenter our minds from ourselves;
        We must unhumanize our views a little, and become confident
        As the rock and ocean that we were made from.
      source: Robinson Jeffers, “Carmel Point”
      tradition: poetry
    - text: |-
        furu ike ya
        kawazu tobikomu
        mizu no oto

        The old pond —
        a frog jumps in.
        Sound of water.
      source: Matsuo Bashō (1686)
      tradition: poetry
    - text: Go, eat your bread with joy, and drink your wine with a merry heart, for God has already approved what you do. Enjoy life with the wife whom you love, all the days of your vain life that he has given you under the sun.
      source: Ecclesiastes 9:7–9
      tradition: jewish-wisdom
    - text: I was a hidden treasure and I loved to be known, so I created the world that I might be known.
      source: Hadith qudsi, widely cited in Sufi tradition
      tradition: mystics
    - text: Do not judge your fellow until you have reached their place.
      source: Hillel the Elder, Pirkei Avot 2:5
      tradition: jewish-wisdom
    - text: "The world stands on three things: on Torah, on service, and on acts of loving-kindness."
      source: Shimon the Just, Pirkei Avot 1:2
      tradition: jewish-wisdom
    - text: He who learns but does not think is lost. He who thinks but does not learn is in great danger.
      source: Confucius, Analects 2:15
      tradition: fragments
    - text: Strive to be a person, and in a place where there are no persons, strive to be a person.
      source: Hillel the Elder, Pirkei Avot 2:6
      tradition: jewish-wisdom
    - text: Life is routine and routine is resistance to wonder.
      source: Abraham Joshua Heschel, Man Is Not Alone
      tradition: jewish-wisdom
    - text: When you arise in the morning, think of what a precious privilege it is to be alive — to breathe, to think, to enjoy, to love.
      source: Marcus Aurelius, Meditations V.1
      tradition: stoics
    - text: In the pursuit of learning, every day something is acquired. In the pursuit of Tao, every day something is dropped. Less and less is done until non-action is achieved. When nothing is done, nothing is left undone.
      source: Lao Tzu, Tao Te Ching Ch. 48
      tradition: daoism
    - text: You have power over your mind — not outside events. Realize this, and you will find strength.
      source: Marcus Aurelius, Meditations VI.8
      tradition: stoics
    - text: As the same fire assumes different shapes when it consumes objects differing in shape, so does the one Self take the shape of every creature in whom he is present.
      source: Katha Upanishad 2.2.9
      tradition: upanishads
    - text: Let us rise up and be thankful, for if we did not learn a lot today, at least we learned a little, and if we did not learn a little, at least we did not get sick, and if we got sick, at least we did not die; so let us all be thankful.
      source: Attributed to Siddhārtha Gautama
      tradition: buddhism
    - text: Every blade of grass has its angel that bends over it and whispers, grow, grow.
      source: Bereishit Rabbah 10:6 (Midrash)
      tradition: jewish-wisdom
    - text: The soul that has seen the most truth shall come to the birth as a philosopher, or artist, or some musical and loving nature.
      source: Plato, Phaedrus 248d
      tradition: fragments
    - text: The highest good is like water. Water gives life to the ten thousand things and does not strive. It flows in places men reject and so is like the Tao.
      source: Lao Tzu, Tao Te Ching Ch. 8
      tradition: daoism
    - text: Loss is nothing else but change, and change is Nature’s delight.
      source: Marcus Aurelius, Meditations IX.35
      tradition: stoics
    - text: In a culture of gratitude, everyone knows that gifts will follow the circle of reciprocity and flow back to you again. Gratitude is the most powerful force for abundance.
      source: Robin Wall Kimmerer, Braiding Sweetgrass
      tradition: companions
    - text: Before enlightenment, chop wood, carry water. After enlightenment, chop wood, carry water.
      source: Zen proverb
      tradition: buddhism
    - text: You have the right to work, but never to the fruit of work. You should never engage in action for the sake of reward, nor should you long for inaction.
      source: Bhagavad Gita 2.47
      tradition: upanishads
    - text: Where there is ruin, there is hope for a treasure.
      source: Rumi, Masnavi
      tradition: mystics
    - text: Look again at that dot. That’s here. That’s home. That’s us. On it everyone you love, everyone you know, everyone you ever heard of, every human being who ever was, lived out their lives.
      source: Carl Sagan, Pale Blue Dot (1994)
      tradition: science
    - text: He who knows others is wise. He who knows himself is enlightened. He who conquers others has physical strength. He who conquers himself is truly strong.
      source: Lao Tzu, Tao Te Ching Ch. 33
      tradition: daoism
    - text: The Torah was not given to angels.
      source: Babylonian Talmud, Berakhot 25b
      tradition: jewish-wisdom
    - text: Waste no more time arguing about what a good man should be. Be one.
      source: Marcus Aurelius, Meditations X.16
      tradition: stoics
    - text: As a mother would risk her life to protect her child, her only child, even so should one cultivate a limitless heart with regard to all beings. With good will for the entire cosmos, cultivate a limitless heart.
      source: Karaniya Metta Sutta, Sutta Nipata 1.8
      tradition: buddhism
    - text: We are all visitors to this time, this place. We are just passing through. Our purpose here is to observe, to learn, to grow, to love, and then we return home.
      source: Australian Aboriginal proverb
      tradition: ancestral
    - text: That which permeates all, which nothing transcends and which, like the universal space around us, fills everything completely from within and without, that Supreme non-dual Brahman — that thou art.
      source: Shankara, Vivekachudamani
      tradition: upanishads
    - text: A tree is not just a tree. It is a crossroads — a gathering place for fungi, insects, birds, bacteria, other plants. Everything in the forest is connected to everything else through a web of underground relationships.
      source: Peter Wohlleben, The Hidden Life of Trees
      tradition: science
    - text: A man should be learned and wise, but not over-wise. For a wise man’s heart is seldom glad, if he is truly wise.
      source: Hávamál, stanza 55
      tradition: fragments
    - text: "The Master said: Is it not a joy to learn something and regularly practice it? Is it not a delight to have friends visit from afar? Is it not a superior person who is not annoyed when people fail to recognize their abilities?"
      source: Confucius, Analects 1:1
      tradition: fragments
    - text: You were born with wings, why prefer to crawl through life?
      source: Rumi
      tradition: mystics
    - text: The world is new to us every morning — this is the gift of the Holy One. Every person should believe they are reborn each day.
      source: Baal Shem Tov (adapted)
      tradition: jewish-wisdom
    - text: The nitrogen in our DNA, the calcium in our teeth, the iron in our blood, the carbon in our apple pies were made in the interiors of collapsing stars. We are made of starstuff.
      source: Carl Sagan, Cosmos (1980)
      tradition: science
    - text: As rivers flowing into the ocean find their final peace and their name and form disappear, so the wise, freed from name and form, find their way to the Supreme Being beyond all this.
      source: Mundaka Upanishad 3.2.8
      tradition: upanishads
    - text: Do not spoil what you have by desiring what you have not; remember that what you now have was once among the things you only hoped for.
      source: Epicurus, Vatican Sayings
      tradition: fragments
    - text: Those who know do not speak. Those who speak do not know.
      source: Lao Tzu, Tao Te Ching Ch. 56
      tradition: daoism
    - text: I ask not for a lighter burden, but for broader shoulders.
      source: Jewish proverb
      tradition: jewish-wisdom
