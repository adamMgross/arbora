- id: wood-those-who-stayed-awake
  circle: Elder
  name: Those Who Stayed Awake
  from: Cherokee
  picture:
    title: Camp Fire
    artist: Winslow Homer
    year: "1880"
    source: https://commons.wikimedia.org/wiki/File:Camp_Fire_MET_DT2829.jpg
    license: CC0
    alt: Two woodsmen keeping a fire at night under dark evergreens, sparks rising.
    trim:
      top: 1.2
      right: 1.4
      bottom: 1.4
      left: 0.7
  principle: principle-3
  story: In the Cherokee telling of how the world was made, the plants and animals were asked to keep watch for seven nights. One by one they fell asleep. A few trees kept the vigil to the end and were given the gift of staying green all year. Among the animals the owl stayed awake, and can see in the dark.
  passages:
    - text: Of the trees only the cedar, the pine, the spruce, the holly, and the laurel were awake to the end, and to them it was given to be always green and to be greatest for medicine.
      attribution: Cherokee, as recorded in James Mooney, *Myths of the Cherokee*, 1900
- id: wood-the-aspen
  circle: Elder
  name: The Aspen
  from: Rocky Mountains, Pando
  picture:
    title: Autumn--On the Hudson River
    artist: Jasper Francis Cropsey
    year: "1860"
    source: https://commons.wikimedia.org/wiki/File:Autumn--On_the_Hudson_River-1860-Jasper_Francis_Cropsey.jpg
    license: public domain
    alt: Tiny figures and cattle in the middle distance.
  principle: principle-1
  story: A stand of aspen is usually one tree. In Utah a single root sends up some forty-seven thousand trunks over a hundred acres and has done so for thousands of years. Each trunk lives about a century. The root does not. In the Rockies the aspens turn gold together in a week, because they are one.
  passages:
    - text: If some one were to strike at the root of this large tree here, it would bleed, but live. If he were to strike at its stem, it would bleed, but live. If he were to strike at its top, it would bleed, but live. Pervaded by the living Self that tree stands firm, drinking in its nourishment and rejoicing.
      attribution: Chandogya Upanishad 6.11, trans. Max Müller, 1879
- id: wood-the-bristlecone
  circle: Elder
  name: The Bristlecone
  from: White Mountains, California
  picture:
    title: Landscape (Landscape with Tree Trunks)
    artist: Thomas Cole
    year: "1828"
    source: https://commons.wikimedia.org/wiki/File:Cole_Thomas_Landscape_with_Dead_Tree_1828.jpg
    license: public domain
    alt: A storm-broken dead tree twists on a dark mountainside as clouds clear from a far peak.
    trim:
      right: 0.8
      bottom: 0.4
      left: 0.2
  principle: principle-2
  story: On a dry ridge at eleven thousand feet, the oldest living trees grow a few inches a century and have stood since before the pyramids. Most of each tree is dead wood, polished by ice, with one strip of living bark feeding one living branch. They live so long because almost nothing else can live there.
  passages:
    - text: For a thousand years in thy sight are but as yesterday when it is past, and as a watch in the night.
      attribution: Psalm 90:4, King James Version
- id: wood-the-useless-tree
  circle: Elder
  name: The Useless Tree
  from: Daoist, Zhuangzi
  picture:
    title: The Nooning
    artist: Winslow Homer
    year: c. 1872
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_The_Nooning.jpg
    license: public domain
    alt: A boy in a straw hat lying in the grass under a tree, doing nothing.
  principle: principle-8
  story: Zhuangzi's friend complains of a huge tree so gnarled that no carpenter will touch it. Zhuangzi answers that its uselessness is why it has grown so old, and suggests lying down beneath it.
  passages:
    - text: Why don't you plant it in Not-Even-Anything Village or the field of Broad-and-Boundless, relax and do nothing by its side, or lie down for a free and easy sleep under it?
      attribution: Zhuangzi, chapter 1, trans. Burton Watson
- id: wood-yggdrasil
  circle: Elder
  name: Yggdrasil
  from: Norse
  picture:
    title: The Titan's Goblet
    artist: Thomas Cole
    year: "1833"
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_The_Titan%27s_Goblet.jpg
    license: public domain
    alt: Only specks of boats and buildings on the goblet's rim.
    trim:
      top: 0.2
      left: 0.3
  principle: principle-5
  story: The Norse world tree is an ash. The nine worlds hang in it, a well lies at its root where the Norns draw water for it every day, an eagle sits in the crown and a serpent gnaws below, and a squirrel runs between them carrying insults. The gods meet beneath it to judge. Odin hung on it nine nights to win the runes.
  passages:
    - text: |-
        An ash I know, Yggdrasil its name,
        With water white is the great tree wet;
        Thence come the dews that fall in the dales,
        Green by Urth's well does it ever grow.
      attribution: Völuspá 19, trans. Henry Adams Bellows, 1923
- id: wood-the-green-man
  circle: Spirit
  name: The Green Man
  from: Carved in Europe's churches
  picture:
    title: The Forest of Arden
    artist: Albert Pinkham Ryder
    year: 1888-97, reworked 1908
    source: https://commons.wikimedia.org/wiki/File:The_Forest_of_Arden_MET_DT240272.jpg
    license: CC0
    alt: Two small figures at the lower left beneath a looming, almost bodily tree.
    trim:
      top: 0.2
      right: 0.2
      bottom: 0.2
      left: 0.2
  principle: principle-1
  story: A face made of leaves, with vines growing from his mouth, carved into hundreds of medieval churches. No one knows exactly what the carvers meant. He looks like what a person becomes when they stop holding themselves apart from the green world.
  passages:
    - text: "Let the field be joyful, and all that is therein: then shall all the trees of the wood rejoice."
      attribution: Psalm 96:12, King James Version
- id: wood-the-dryads
  circle: Spirit
  name: The Dryads
  from: Greek
  picture:
    title: Dream of Arcadia
    artist: Thomas Cole
    year: c. 1838
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_Dream_of_Arcadia_-_Google_Art_Project.jpg
    license: public domain
    alt: Small figures in classical dress dancing and resting under trees near a temple.
    trim:
      top: 0.8
      right: 0.3
  principle: principle-1
  story: In the Homeric hymn the mountain nymphs are born with their trees and die with them. When a pine or an oak withers, its nymph leaves the light of the sun. The Greeks did not say the tree had a spirit. They said the spirit had a tree. In this wood she comes out of a birch.
  passages:
    - text: At their birth pines or high-topped oaks spring up with them upon the fruitful earth … but when the fate of death is near at hand, first those lovely trees wither where they stand, and the bark shrivels away about them, and the twigs fall down, and at last the life of the Nymph and of the tree leave the light of the sun together.
      attribution: Homeric Hymn to Aphrodite 264–272, trans. Hugh G. Evelyn-White, 1914
- id: wood-kodama
  circle: Spirit
  name: Kodama
  from: Japanese, Shinto
  picture:
    title: The Grizzly Giant Sequoia, Mariposa Grove, California
    artist: Albert Bierstadt
    year: c. 1872-1873
    source: https://commons.wikimedia.org/wiki/File:Albert_Bierstadt_-_The_Grizzly_Giant_Sequoia,_Mariposa_Grove,_California.jpg
    license: public domain
    alt: One ancient sequoia stands among younger trees in a hushed grey light.
  principle: principle-8
  story: In Japan a kodama is the spirit of an old tree, and the echo that comes back from a mountainside was once said to be its voice. A tree with a kodama in it was marked with a rope and left standing. Fell one anyway, and misfortune followed the axe home. The cedars of the Pacific coast are the right size for one.
  passages:
    - text: "For ye shall go out with joy, and be led forth with peace: the mountains and the hills shall break forth before you into singing, and all the trees of the field shall clap their hands."
      attribution: Isaiah 55:12, King James Version
- id: wood-the-dark-wood
  circle: Passage
  name: The Dark Wood
  from: Dante, Italy, c. 1308
  picture:
    title: "The Voyage of Life: Manhood"
    artist: Thomas Cole
    year: "1842"
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_The_Voyage_of_Life_Manhood,_1842_(National_Gallery_of_Art).jpg
    license: public domain
    alt: A man alone in a small boat, hands clasped, carried toward rapids under storm and dead trees.
    trim:
      top: 0.4
      left: 0.2
  principle: principle-7
  story: Every people who live near forests know what it is to get lost in one. The dark wood is where the old path ends and the next one has not appeared. Dante begins the greatest poem of his age there, which says something about where journeys start.
  passages:
    - text: |-
        Midway upon the journey of our life
        I found myself within a forest dark,
        For the straightforward pathway had been lost.
      attribution: Dante, *Inferno* I.1–3, trans. Henry Wadsworth Longfellow
  question: Where has the straight path disappeared, and what are you noticing now that you have to look?
  table: When were you most lost, and what did you only see because the path was gone?
- id: wood-the-nurse-log
  circle: Passage
  name: The Nurse Log
  from: The old-growth forest
  picture:
    title: Study of a Wood Interior
    artist: Asher Brown Durand
    year: c. 1850
    source: https://commons.wikimedia.org/wiki/File:AsherDurand-Study_Woodland_Interior.jpg
    license: public domain
    alt: Moss-covered boulders split by roots in a green forest, saplings growing from the rock.
    trim:
      top: 0.9
      right: 0.6
  principle: principle-4
  story: When an old tree falls in a deep forest it keeps giving for centuries. Seedlings root along its back, fungi turn its wood to soil, and threads under the ground carry what it held to the trees around it. In the Pacific Northwest whole rows of hemlocks stand on stilts where the log they grew on has gone. An ending can be the ground something else grows from.
  passages:
    - text: For there is hope of a tree, if it be cut down, that it will sprout again, and that the tender branch thereof will not cease.
      attribution: Job 14:7, King James Version
  question: What ended in your life that is now feeding something new?
  table: Name something that ended and is still feeding you.
- id: wood-leaf-fall
  circle: Passage
  name: Leaf-fall
  from: Homer, Iliad VI
  picture:
    title: Autumn
    artist: Winslow Homer
    year: "1877"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer,_Autumn,_1877,_NGA_66420.jpg
    license: public domain
    alt: A young woman standing in falling leaves, holding a spray of them.
  principle: principle-2
  story: Asked who he is before a fight, Glaucus answers with the oldest image for a human generation, leaves. Trees do it every year without grief. The Greeks put the comparison in the mouth of a man about to risk his life.
  passages:
    - text: |-
        Like leaves on trees the race of man is found,
        Now green in youth, now withering on the ground;
        Another race the following spring supplies;
        They fall successive, and successive rise.
      attribution: Homer, *Iliad* VI, trans. Alexander Pope, 1715
  question: What are you being asked to let fall this season, and what is already budding in its place?
  table: What did each of you let fall this year?
- id: wood-the-white-pine
  circle: Elder
  name: The White Pine
  from: Haudenosaunee
  picture:
    title: The Pic-Nic
    artist: Thomas Cole
    year: "1846"
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_The_Pic-Nic_(1846)_-_Google_Art_Project.jpg
    license: public domain
    alt: A crowd of people at ease together beneath one great tree by a lake, one playing a guitar.
    trim:
      top: 0.4
      right: 0.3
      bottom: 0.2
      left: 0.5
  principle: principle-6
  story: The Haudenosaunee tell that the Peacemaker brought five warring nations together and planted a great white pine at Onondaga as the sign of their union. The nations threw their weapons into the hole beneath it, where a current carried them away. Four white roots ran out to the four directions for any people who would follow them back to the tree, and an eagle sat at the top to watch for danger.
  passages:
    - text: Roots have spread out from the Tree of the Great Peace, one to the north, one to the east, one to the south and one to the west. The name of these roots is The Great White Roots and their nature is Peace and Strength.
      attribution: The Constitution of the Five Nations, section 2, as recorded by Arthur C. Parker, 1916
- id: wood-the-sugar-maple
  circle: Elder
  name: The Sugar Maple
  from: New England and the Great Lakes
  picture:
    title: The Sugar Camp
    artist: Eastman Johnson
    year: 1861-1866
    source: https://commons.wikimedia.org/wiki/File:Eastman_Johnson_-_The_Sugar_Camp_(also_known_as_Making_Maple_Sugar_or_Susan_Ray%E2%80%99s_Maple_Sugaring_Kitchen)_-_1992.5.14_-_Yale_University_Art_Gallery.jpg
    license: public domain
    alt: Two men tending sap and a barrel at a sugar camp with snow at the door.
  principle: principle-4
  story: At the end of winter, when the nights still freeze and the days begin to thaw, the sap of the sugar maple runs. The Haudenosaunee and the Anishinaabe were boiling it down long before anyone else on the continent, and the Haudenosaunee Thanksgiving Address greets the maple as the leader of the trees. It takes about forty gallons of sap to make one of syrup. The tree gives it at the leanest moment of the year.
  passages:
    - text: Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price.
      attribution: Isaiah 55:1, King James Version
- id: wood-the-paper-birch
  circle: Elder
  name: The Paper Birch
  from: The north woods
  picture:
    title: Landscape with Birches
    artist: Asher Brown Durand
    year: "1855"
    source: https://commons.wikimedia.org/wiki/File:Asher_Brown_Durand_-_Landscape_with_Birches_-_63.268_-_Museum_of_Fine_Arts.jpg
    license: public domain
    alt: Tall white birches frame a view down a wooded valley to blue hills, fallen logs in the foreground.
    trim:
      top: 0.8
      right: 1.1
      bottom: 0.7
      left: 1.1
  principle: principle-1
  story: After a fire in the north woods, the paper birch is among the first trees back, a stand of white trunks rising out of the ash to shade the spruce and fir that will one day replace it. Its bark peels in sheets like pages and does not rot, so the Anishinaabe and their neighbors made canoes of it, and containers, and lodges. It lives about a century and makes way.
  passages:
    - text: To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified.
      attribution: Isaiah 61:3, King James Version
- id: wood-the-redwood
  circle: Elder
  name: The Redwood
  from: The California coast
  picture:
    title: Giant Redwood Trees of California
    artist: Albert Bierstadt
    year: "1874"
    source: https://commons.wikimedia.org/wiki/File:Albert_Bierstadt_-_Giant_Redwood_Trees_of_California_-_Google_Art_Project.jpg
    license: public domain
    alt: Three small Native figures at the base, one walking with a burden basket beneath a vast trunk.
    trim:
      top: 0.5
      left: 0.5
  principle: principle-5
  story: The coast redwood is the tallest living thing, and it drinks the fog. In a dry summer as much as a third of its water is mist combed out of the air by its needles. When an old redwood falls or burns, young trees sprout from its roots in a ring around the place where it stood, and grow up in a circle around an absence. Foresters call them family circles.
  passages:
    - text: "The righteous shall flourish like the palm tree: he shall grow like a cedar in Lebanon. … They shall still bring forth fruit in old age; they shall be fat and flourishing."
      attribution: Psalm 92:12, 14, King James Version
- id: wood-the-oak
  circle: Elder
  name: The Oak
  from: Celtic, the druids
  picture:
    title: The Monk
    artist: George Inness
    year: "1873"
    source: https://commons.wikimedia.org/wiki/File:George_Inness_-_The_Monk_(1873).jpg
    license: public domain
    alt: A single white-robed monk walking under a grove at dusk.
    trim:
      bottom: 0.3
  principle: principle-8
  story: The Roman writers say the druids kept their rites in oak groves, and their name may mean oak-knowers. Across Europe the oak was the tree of the sky god, from Zeus's oracle at Dodona, where priests listened to the rustling of its leaves, to the oak of Thor that Boniface cut down. Lightning seems to find oaks more than other trees, which may be why.
  passages:
    - text: The Druids—for that is the name they give to their magicians—held nothing more sacred than the mistletoe and the tree that bears it, supposing always that tree to be the robur. Of itself the robur is selected by them to form whole groves, and they perform none of their religious rites without employing branches of it.
      attribution: Pliny the Elder, *Natural History* XVI.95, trans. John Bostock and H. T. Riley, 1855
- id: wood-the-bodhi-tree
  circle: Elder
  name: The Bodhi Tree
  from: Buddhist, Bodh Gaya
  picture:
    title: Indian at Sunset
    artist: Thomas Cole
    year: 1845-47
    source: https://commons.wikimedia.org/wiki/File:Cole_Thomas_Indian_at_Sunset_1845-47.jpg
    license: public domain
    alt: A man seated alone at the foot of a great tree, facing the lake at sunset.
  principle: principle-3
  story: Siddhartha sat down under a pipal fig at Bodh Gaya and resolved not to rise until he understood. He rose the Buddha. A cutting of that tree was carried to Sri Lanka in the third century before the common era and planted at Anuradhapura, where it still grows, the oldest tree in the world planted by a person on a known date. Bodhi trees at temples across Asia grow from its cuttings.
  passages:
    - text: At that time the blessed Buddha dwelt at Uruvelâ, on the bank of the river Nerañgarâ, at the foot of the Bodhi tree (tree of wisdom), just after he had become Sambuddha. And the blessed Buddha sat cross-legged at the foot of the Bodhi tree uninterruptedly during seven days, enjoying the bliss of emancipation.
      attribution: Mahâvagga I.1, trans. T. W. Rhys Davids and Hermann Oldenberg, 1881
- id: wood-the-ceiba
  circle: Elder
  name: The Ceiba
  from: Maya
  picture:
    title: The Lonely Pine
    artist: George Inness
    year: c. 1880s
    source: https://commons.wikimedia.org/wiki/File:The_Lonely_Pine_by_George_Inness_(Detroit_Inst_Arts_51.331).jpg
    license: public domain
    alt: A lone evergreen stands in a wide green meadow under a dark sky with an orange band of sunset.
    trim:
      top: 0.9
      right: 0.6
  principle: principle-1
  story: For the Maya the world has a great tree at each of its four corners and one at its center, and the tree at the center is the ceiba, the green tree, whose roots go down into the underworld and whose branches hold up the sky. A ceiba is still left standing when the forest around it is cleared, alone in the middle of a field, and its spines and buttresses make it look built rather than grown.
  passages:
    - text: And out of the ground made the LORD God to grow every tree that is pleasant to the sight, and good for food; the tree of life also in the midst of the garden, and the tree of knowledge of good and evil.
      attribution: Genesis 2:9, King James Version
- id: wood-honis-carob
  circle: Elder
  name: Honi's Carob
  from: Jewish, the Talmud
  picture:
    title: Home in the Woods
    artist: Thomas Cole
    year: "1847"
    source: https://commons.wikimedia.org/wiki/File:Cole_Thomas_Home_in_the_Woods_1847.jpg
    license: public domain
    alt: A settler family at a log cabin in a clearing, a man returning with fish, children at the door.
  principle: principle-5
  story: Honi the Circle-Maker saw a man planting a carob and asked how long it would take to bear fruit. Seventy years, the man said. Honi asked whether he expected to live seventy years. The man answered that he had found the world full of carob trees planted by those before him, and was planting for those after. Then Honi fell asleep for seventy years and woke to see the man's grandson gathering the fruit.
  passages:
    - text: And Abraham planted a grove in Beer-sheba, and called there on the name of the LORD, the everlasting God.
      attribution: Genesis 21:33, King James Version
- id: wood-humbaba
  circle: Spirit
  name: Humbaba
  from: Mesopotamian, Gilgamesh
  picture:
    title: Hunter Mountain, Twilight
    artist: Sanford Robinson Gifford
    year: "1866"
    source: https://commons.wikimedia.org/wiki/File:Sanford_Robinson_Gifford_-_Cr%C3%A9puscule_sur_le_mont_Hunter.jpg
    license: public domain
    alt: A cleared valley of stumps with a small cabin, rising to forested slopes and a blue mountain at sunset.
    trim:
      right: 0.2
      bottom: 0.5
      left: 0.2
  principle: principle-8
  story: In the oldest written epic, Humbaba guards the Cedar Forest for the gods, a giant whose voice is the flood and whose breath is fire. Gilgamesh and Enkidu go to kill him for fame and for cedar, and they do. The poem does not let them enjoy it. The gods take Enkidu for the killing, and Gilgamesh goes looking for a way not to die. The guardian of a forest is there for a reason.
  passages:
    - text: "The trees of the LORD are full of sap; the cedars of Lebanon, which he hath planted; Where the birds make their nests: as for the stork, the fir trees are her house."
      attribution: Psalm 104:16–17, King James Version
- id: wood-pan
  circle: Spirit
  name: Pan
  from: Greek, Arcadia
  picture:
    title: "The Course of Empire: The Arcadian or Pastoral State"
    artist: Thomas Cole
    year: "1834"
    source: https://commons.wikimedia.org/wiki/File:Cole_Thomas_The_Course_of_Empire_The_Arcadian_or_Pastoral_State_1836.jpg
    license: public domain
    alt: A shepherd, a dancing group, and an old man drawing figures in the dirt, all small.
    trim:
      right: 0.2
  principle: principle-1
  story: Pan is the god of the wild places of Arcadia, goat-legged and piping, the source of the sudden fear that comes over people alone in the woods, which is why it is called panic. Socrates, who almost never left the city, prayed to him once, at the end of a long afternoon under a plane tree by a stream outside Athens.
  passages:
    - text: Beloved Pan, and all ye other gods who haunt this place, give me beauty in the inward soul; and may the outward and inward man be at one.
      attribution: Plato, *Phaedrus* 279b, trans. Benjamin Jowett
- id: wood-the-leshy
  circle: Spirit
  name: The Leshy
  from: Slavic
  picture:
    title: "Landscape with Figures: A Scene from The Last of the Mohicans"
    artist: Thomas Cole
    year: "1826"
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_Landscape_with_Figures,_A_Scene_from_The_Last_of_the_Mohicans_(1826).jpg
    license: public domain
    alt: A lone figure on a rock in a tangled wild valley, another small figure below.
    trim:
      left: 0.2
  principle: principle-7
  story: In the Slavic forests the leshy is the master of the woods, as tall as the trees in the forest and as small as the grass in the meadow. He leads travelers in circles until they are lost. The remedy, the old people said, is to sit down, take off your clothes and put them back on inside out, and change your shoes from one foot to the other. Then the paths come right again.
  passages:
    - text: And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.
      attribution: Isaiah 30:21, King James Version
- id: wood-tapio
  circle: Spirit
  name: Tapio
  from: Finnish, the Kalevala
  picture:
    title: Hound and Hunter
    artist: Winslow Homer
    year: "1892"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer,_Hound_and_Hunter,_1892,_NGA_33970.jpg
    license: public domain
    alt: A boy in a canoe holding a swimming deer by the antlers, a hound arriving.
    trim:
      top: 0.6
      right: 0.3
      bottom: 0.6
      left: 0.3
  principle: principle-4
  story: In the Finnish woods Tapio is the forest's king and Mielikki its mistress, and a hunter asks them for game rather than taking it. In the Kalevala the hunter sings to them, praising their forest castle and promising gifts, and the old hunters left offerings on a stump. What the forest gives is given.
  passages:
    - text: "For every beast of the forest is mine, and the cattle upon a thousand hills. I know all the fowls of the mountains: and the wild beasts of the field are mine."
      attribution: Psalm 50:10–11, King James Version
- id: wood-cernunnos
  circle: Spirit
  name: Cernunnos
  from: Celtic, Gaul
  picture:
    title: Guide Carrying a Deer
    artist: Winslow Homer
    year: "1891"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_Guide_Carrying_a_Deer.jpg
    license: public domain
    alt: A woodsman carrying a deer across his shoulders, its head beside his.
    trim:
      top: 9.5
      right: 1.9
      bottom: 2.2
      left: 1.9
  principle: principle-1
  story: A god with a stag's antlers sits cross-legged on a silver cauldron found in a Danish bog, holding a torc in one hand and a serpent in the other, with a stag beside him and animals all around. A stone carved in Paris in the first century names him Cernunnos. Almost nothing written about him survives. He is known only by what surrounds him.
  passages:
    - text: As the hart panteth after the water brooks, so panteth my soul after thee, O God.
      attribution: Psalm 42:1, King James Version
- id: wood-the-yakshi
  circle: Spirit
  name: The Yakshi
  from: India, Sanchi
  picture:
    title: Girl in the Orchard
    artist: Winslow Homer
    year: "1874"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_Girl_in_the_Orchard,_1874.jpg
    license: public domain
    alt: A young woman standing under apple trees, head bowed, hat in hand.
  principle: principle-1
  story: On the stone gateways of the great stupa at Sanchi, a woman leans out from a tree, one arm around its trunk and one hand pulling down a branch, and the tree blooms at her touch. She is a yakshi, one of the spirits of trees and fertility worshipped in India before the Buddha and carved onto his monuments anyway. The Buddha's mother is said to have given birth holding the branch of a sal tree in the same pose.
  passages:
    - text: As the apple tree among the trees of the wood, so is my beloved among the sons. I sat down under his shadow with great delight, and his fruit was sweet to my taste.
      attribution: Song of Songs 2:3, King James Version
- id: wood-the-burning-bush
  circle: Spirit
  name: The Burning Bush
  from: Hebrew, Exodus
  picture:
    title: A Gorge in the Mountains (Kauterskill Clove)
    artist: Sanford Robinson Gifford
    year: "1862"
    source: https://commons.wikimedia.org/wiki/File:A_Gorge_in_the_Mountains_(Kauterskill_Clove)_MET_DT81.jpg
    license: CC0
    alt: A golden haze of sunlight fills a deep mountain gorge, one tree lit at the edge of the cliff.
    trim:
      top: 1
      right: 1.2
      bottom: 1
      left: 1.2
  principle: principle-8
  story: Moses was keeping his father-in-law's sheep at the back of the wilderness when he saw a bush on fire that was not burning up. He turned aside to look, and only when he turned aside did the voice call his name. The first thing it told him was to take off his shoes. The Midrash says the presence chose a thornbush to teach that no place is empty of it.
  passages:
    - text: "And the angel of the LORD appeared unto him in a flame of fire out of the midst of a bush: and he looked, and, behold, the bush burned with fire, and the bush was not consumed. … put off thy shoes from off thy feet, for the place whereon thou standest is holy ground."
      attribution: Exodus 3:2, 5, King James Version
- id: wood-the-owl
  circle: Spirit
  name: The Owl
  from: Many peoples
  picture:
    title: Moonlight, Indian Encampment
    artist: Ralph Albert Blakelock
    year: 1885 to 1889
    source: https://commons.wikimedia.org/wiki/File:Ralph_Albert_Blakelock_-_Moonlight,_Indian_Encampment_-_1929.6.3_-_Smithsonian_American_Art_Museum.jpg
    license: public domain
    alt: A lone silhouetted figure standing by moonlit water under dark trees, a fire by the tents.
    trim:
      left: 0.3
  principle: principle-3
  story: The owl belongs to Athena, who sees clearly, and its picture was stamped on the coins of Athens. In the Cherokee telling of the seven nights, the owl was among the animals that stayed awake, and was given sight in the dark. In other places it is the bird of death and bad news. Everywhere it is the one awake when everyone else is sleeping, which is a gift and a loneliness.
  passages:
    - text: "I am like a pelican of the wilderness: I am like an owl of the desert. I watch, and am as a sparrow alone upon the house top."
      attribution: Psalm 102:6–7, King James Version
- id: wood-the-forest-sage
  circle: Spirit
  name: The Forest Sage
  from: Hindu, the forest books
  picture:
    title: Kindred Spirits
    artist: Asher B. Durand
    year: "1849"
    source: https://commons.wikimedia.org/wiki/File:Asher_B._Durand_-_Kindred_Spirits_-_2010.106_-_Crystal_Bridges_Museum_of_American_Art.jpg
    license: public domain
    alt: Two men standing on a ledge under an arching tree, one gesturing as he talks.
  principle: principle-3
  story: The oldest Indian wisdom was spoken among trees. The Upanishads were taught in forest hermitages, and the texts just before them are called the Aranyakas, the forest books. The laws of Manu describe a stage of life, after the work of the household is done, when a person goes to live in the forest, eating what it gives and studying. The forest is where you go to learn what could not be learned at home.
  passages:
    - text: When a householder sees his (skin) wrinkled, and (his hair) white, and the sons of his sons, then he may resort to the forest.
      attribution: The Laws of Manu VI.2, trans. Georg Bühler, 1886
- id: wood-the-wind-in-the-tops
  circle: Spirit
  name: The Wind in the Tops
  from: Hebrew and Greek scripture
  picture:
    title: The Coming Storm
    artist: George Inness
    year: c. 1879
    source: https://commons.wikimedia.org/wiki/File:George_Inness_-_The_Coming_Storm_(c._1879).jpg
    license: public domain
    alt: A lone figure walking across a field toward bending trees under a dark sky.
    trim:
      bottom: 0.3
  principle: principle-8
  story: In Hebrew and in Greek one word means wind, breath and spirit. David was told to wait until he heard the sound of marching in the tops of the trees, and then to move, because then he would not be going alone. In the gospel the wind blows where it wishes, and you hear its sound but cannot say where it came from. In a forest you hear it before you feel it, coming through the tops a long way off.
  passages:
    - text: "The wind bloweth where it listeth, and thou hearest the sound thereof, but canst not tell whence it cometh, and whither it goeth: so is every one that is born of the Spirit."
      attribution: John 3:8, King James Version
- id: wood-the-clearing
  circle: Passage
  name: The Clearing
  from: The deep forest
  picture:
    title: The First Harvest in the Wilderness
    artist: Asher B. Durand
    year: "1855"
    source: https://commons.wikimedia.org/wiki/File:Asher_B._Durand_-_The_First_Harvest_in_the_Wilderness_-_Google_Art_Project.jpg
    license: public domain
    alt: A tiny reaper in a sunlit field among stumps, a cabin at the edge.
    trim:
      top: 2.8
      right: 1.7
      bottom: 2.3
      left: 1.6
  principle: principle-3
  story: Somewhere in every old forest a tree has fallen and taken its neighbors with it, and the sun reaches the ground for the first time in a century. Seeds that waited in the soil for decades wake. Light-hungry things grow fast. Foresters call it a gap, and most of a forest's change happens in its gaps. A clearing is what a loss looks like from the ground, a year later.
  passages:
    - text: "The people that walked in darkness have seen a great light: they that dwell in the land of the shadow of death, upon them hath the light shined."
      attribution: Isaiah 9:2, King James Version
  question: What has fallen and let the light in?
  table: Where in your life did an opening come from something falling?
- id: wood-rings
  circle: Passage
  name: Rings
  from: The cut stump
  picture:
    title: The Old Hunting Grounds
    artist: Worthington Whittredge
    year: "1864"
    source: https://commons.wikimedia.org/wiki/File:The_Old_Hunting_Grounds_by_Worthington_Whittredge,_1864.jpg
    license: public domain
    alt: A grove of white birches arches over a still pool, an empty birchbark canoe pulled up at the water.
    trim:
      top: 0.2
  principle: principle-2
  story: Every year a tree lays down a ring, pale and wide in a good spring, dark and narrow in drought. Fire scars, insect years, the year the neighbor fell and the light came in are all written in the wood, outside the old rings and never over them. Read across thousands of trees, the rings date old roof beams and keep the record of a climate.
  passages:
    - text: "One generation passeth away, and another generation cometh: but the earth abideth for ever."
      attribution: Ecclesiastes 1:4, King James Version
  question: What would this year's ring show, wide or narrow, and what is it wrapped around?
  table: What was a narrow year for you that turned out to hold?
- id: wood-the-seed
  circle: Passage
  name: The Seed
  from: Chandogya Upanishad
  picture:
    title: Winnowing Grain
    artist: Eastman Johnson
    year: c. 1873-1879
    source: https://commons.wikimedia.org/wiki/File:Eastman_Johnson_-_Winnowing_Grain.jpg
    license: public domain
    alt: A young farmer pouring a stream of grain from a basket in a shaft of light.
  principle: principle-8
  story: A father sends his son to fetch a fig from the great banyan, has him break it open, then break open one of the tiny seeds inside, and asks what he sees. Nothing, says the son. The father says that from that nothing the whole great tree has grown, that the same fine essence is the self of everything, and then, you are that.
  passages:
    - text: "'Fetch me from thence a fruit of the Nyagrodha tree.' 'Here is one, Sir.' 'Break it.' 'It is broken, Sir.' 'What do you see there?' 'These seeds, almost infinitesimal.' 'Break one of them.' 'It is broken, Sir.' 'What do you see there?' 'Not anything, Sir.' The father said: 'My son, that subtile essence which you do not perceive there, of that very essence this great Nyagrodha tree exists.'"
      attribution: Chandogya Upanishad 6.12, trans. Max Müller, 1879
  question: What small thing in you holds more than it looks like?
  table: What started as almost nothing and became something large in your life?
- id: wood-fire
  circle: Passage
  name: Fire
  from: The western forests
  picture:
    title: The Guide and Woodsman
    artist: Winslow Homer
    year: "1889"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_The_Guide_and_Woodsman_(1889).jpg
    license: public domain
    alt: A woodsman with an axe walking past charred stumps toward a spruce ridge.
    trim:
      top: 0.2
      right: 0.4
      bottom: 0.5
      left: 0.2
  principle: principle-8
  story: Some forests need to burn. Many cones of the lodgepole pine are sealed with resin that only fire melts, and the giant sequoia drops its seeds onto ash, where its seedlings take best. Low fires clear the brush and leave the big trees standing. The forests that never burn are the ones that burn worst when they finally do.
  passages:
    - text: "When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee."
      attribution: Isaiah 43:2, King James Version
  question: What has burned through your life, and what could only grow because it did?
  table: What fire cleared ground for something good in your life?
- id: wood-shelter
  circle: Passage
  name: Shelter
  from: Every rain
  picture:
    title: Bo-Peep
    artist: Winslow Homer
    year: "1878"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_Bo-Peep_(1878).jpg
    license: public domain
    alt: A young shepherdess sitting against a great tree trunk, chin in her hand.
    trim:
      top: 0.3
      right: 0.3
      left: 0.5
  principle: principle-6
  story: Caught in the rain on a mountain, people go under the biggest tree they can find. Under an old fir the ground can stay dry through an hour of rain. Birds, deer and people have all known this for as long as there have been trees and rain. To shelter is to admit that you are not, at the moment, enough by yourself.
  passages:
    - text: And a man shall be as an hiding place from the wind, and a covert from the tempest; as rivers of water in a dry place, as the shadow of a great rock in a weary land.
      attribution: Isaiah 32:2, King James Version
  question: Where are you sheltering right now, and from what?
  table: Who has been a shelter for you, and whom have you sheltered?
- id: wood-the-old-paths
  circle: Passage
  name: The Old Paths
  from: Jeremiah
  picture:
    title: The Beeches
    artist: Asher Brown Durand
    year: "1845"
    source: https://commons.wikimedia.org/wiki/File:The_Beeches_MET_DT75.jpg
    license: CC0
    alt: A shepherd and flock walking a worn path under ancient beeches.
    trim:
      top: 1.4
      right: 1.7
      bottom: 1.8
      left: 1.7
  principle: principle-5
  story: Old trails in a forest are often older than the maps. Game trails became footpaths and footpaths became roads. Walking one, you put your feet where thousands have put theirs, and the path knows where the water is and where the pass is lower. The prophet told a people who had lost their way to stand at the crossroads and ask for the old paths.
  passages:
    - text: Thus saith the LORD, Stand ye in the ways, and see, and ask for the old paths, where is the good way, and walk therein, and ye shall find rest for your souls.
      attribution: Jeremiah 6:16, King James Version
  question: What old way have you walked away from that might still know where the water is?
  table: What did someone older teach you that you only understood later?
- id: wood-pruning
  circle: Passage
  name: Pruning
  from: The orchard and the vine
  picture:
    title: The Woodchopper, Lake Featherstonhaugh
    artist: Thomas Cole
    year: "1826"
    source: https://commons.wikimedia.org/wiki/File:The_Woodchopper,_Lake_Featherstonhaugh.jpg
    license: public domain
    alt: A woodsman with an axe stands at the foot of a dead, stripped tree in an autumn clearing.
    trim:
      top: 2.1
      right: 2.2
      bottom: 1.8
      left: 2.2
  principle: principle-3
  story: A gardener cuts back a healthy branch so the tree can put its strength elsewhere, and a vine left unpruned grows long and wild and bears little. In the forest the trees prune themselves. The lower branches of a fir die in the shade and drop, and the trunk rises clean. What is cut away was alive, which is why it is hard.
  passages:
    - text: "Every branch in me that beareth not fruit he taketh away: and every branch that beareth fruit, he purgeth it, that it may bring forth more fruit."
      attribution: John 15:2, King James Version
  question: What living branch would you cut back if you wanted your strength to go elsewhere?
  table: What did you give up that turned out to make room?
- id: wood-the-root
  circle: Passage
  name: The Root
  from: The ground beneath
  picture:
    title: Tree in a Landscape
    artist: John Frederick Kensett
    year: 19th century
    source: https://commons.wikimedia.org/wiki/File:John_Frederick_Kensett_-_Tree_in_a_Landscape.jpg
    license: public domain
    alt: An old tree grips bare rock with its roots exposed, above a dry valley.
  principle: principle-5
  story: Most of a tree is out of sight. The roots of a big oak spread wider than its crown, and in a dry year the tree lives on what they reach. The trees blown down in storms are mostly the ones whose roots ran shallow, in wet ground where they never had to go deep. The prophet said a people that survived would take root downward first, and only then bear fruit upward.
  passages:
    - text: And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward.
      attribution: Isaiah 37:31, King James Version
  question: What are your roots reaching for in this dry season?
  table: What has kept you standing in a storm?
- id: wood-dormancy
  circle: Passage
  name: Dormancy
  from: The winter woods
  picture:
    title: Winter in the Country
    artist: George Henry Durrie
    year: "1857"
    source: https://commons.wikimedia.org/wiki/File:George_Henry_Durrie_-_Winter_in_the_Country_-_Google_Art_Project.jpg
    license: public domain
    alt: Farm folk with a sleigh and oxen go about their work under a bare, sleeping elm.
    trim:
      top: 0.9
      right: 1
      bottom: 2.4
      left: 0.5
  principle: principle-2
  story: In winter a maple looks dead. It has dropped its leaves, sealed its wounds, moved its water out of the cells that would burst in a freeze, and stopped. The buds for next spring are already formed, wrapped in scales. A tree that did not stop in winter would not survive it. Rest is part of the work.
  passages:
    - text: Though the root thereof wax old in the earth, and the stock thereof die in the ground; Yet through the scent of water it will bud, and bring forth boughs like a plant.
      attribution: Job 14:8–9, King James Version
  question: What in you is resting, and what have you been calling it?
  table: When did a season of doing nothing turn out to matter?
- id: wood-grafting
  circle: Passage
  name: Grafting
  from: The orchard
  picture:
    title: Apple Orchard
    artist: George Inness
    year: "1892"
    source: https://commons.wikimedia.org/wiki/File:George_Inness_-_Apple_Orchard_-_23.100_-_Detroit_Institute_of_Arts.jpg
    license: public domain
    alt: A tiny figure stands among the orchard trees near a red barn.
    trim:
      top: 0.3
      left: 0.2
  principle: principle-6
  story: A grafter cuts a branch from one tree and binds it into another, and if the wood takes, the two grow as one tree, with the roots of one and the fruit of the other. Paul used the image for strangers who joined an old people, a wild olive branch grafted into a cultivated tree, drawing on a root it did not grow. Belonging can be given as well as inherited.
  passages:
    - text: And if some of the branches be broken off, and thou, being a wild olive tree, wert graffed in among them, and with them partakest of the root and fatness of the olive tree; Boast not against the branches. But if thou boast, thou bearest not the root, but the root thee.
      attribution: Romans 11:17–18, King James Version
  question: What root are you drawing on that you did not grow yourself?
  table: Where have you been taken in, and where have you taken someone in?
- id: wood-the-fruit
  circle: Passage
  name: The Fruit
  from: The orchard in September
  picture:
    title: Peace and Plenty
    artist: George Inness
    year: "1865"
    source: https://commons.wikimedia.org/wiki/File:Peace_and_Plenty_MET_DP159755.jpg
    license: CC0
    alt: Small harvesters among sheaves in a broad golden valley at evening.
    trim:
      top: 1
      right: 0.7
      bottom: 0.8
      left: 1
  principle: principle-4
  story: A tree does not eat its own fruit. It makes it for the birds and animals and people who will carry its seed away, and the fruit is how anyone outside the tree knows what kind of tree it is. You cannot tell an apple from a crabapple in winter. You can in September.
  passages:
    - text: Ye shall know them by their fruits. Do men gather grapes of thorns, or figs of thistles?
      attribution: Matthew 7:16, King James Version
  question: What are you making that is for someone else to carry away?
  table: By what fruit would the people at this table know you?
- id: wood-bending
  circle: Passage
  name: Bending
  from: Tao Te Ching
  picture:
    title: The Tempest
    artist: Thomas Cole
    year: c. 1826
    source: https://commons.wikimedia.org/wiki/File:The_Tempest_by_Thomas_Cole,_c._1826,_High_Museum_of_Art.jpg
    license: public domain
    alt: Two figures crouch at the base of rocks while a storm wrenches a twisted tree above them.
    trim:
      left: 0.3
  principle: principle-8
  story: In a hard wind the stiff trees break and the supple ones bend and stand up again. Willows and young birches can be bowed to the ground by snow and rise in spring. Laozi, who took water and infants and grass for his images of strength, said that what is hard and stiff belongs with death and what is soft and supple belongs with life.
  passages:
    - text: Trees and plants, in their early growth, are soft and brittle; at their death, dry and withered. Thus it is that firmness and strength are the concomitants of death; softness and weakness, the concomitants of life.
      attribution: Tao Te Ching 76, trans. James Legge
  question: Where are you holding stiff against something you could bend under?
  table: When did giving way turn out to be the strong thing?
- id: wood-stillness
  circle: Passage
  name: Stillness
  from: The windless forest
  picture:
    title: The Trout Pool
    artist: Worthington Whittredge
    year: "1870"
    source: https://commons.wikimedia.org/wiki/File:The_Trout_Pool_MET_DT11615.jpg
    license: CC0
    alt: A forest stream runs through golden autumn light under tall trunks, a fallen log across the water.
    trim:
      top: 1.2
      right: 0.9
      bottom: 0.8
      left: 1.1
  principle: principle-3
  story: Deep in an old forest on a windless day it can be quieter than any room. Moss, needles and trunks soak up the sound, and after a while you begin to hear what was under the noise, a creek a long way off, a woodpecker, your own breath. Every contemplative tradition has a word for this stillness, and most of them went to the woods to find it.
  passages:
    - text: The (state of) vacancy should be brought to the utmost degree, and that of stillness guarded with unwearying vigour. All things alike go through their processes of activity, and (then) we see them return (to their original state). When things (in the vegetable world) have displayed their luxuriant growth, we see each of them return to its root.
      attribution: Tao Te Ching 16, trans. James Legge
  question: What do you hear when the noise stops?
  table: Where do you go to be still?
- id: wood-the-sprout
  circle: Passage
  name: The Sprout
  from: Tao Te Ching
  picture:
    title: "The Voyage of Life: Childhood"
    artist: Thomas Cole
    year: "1842"
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_The_Voyage_of_Life_Childhood,_1842_(National_Gallery_of_Art).jpg
    license: public domain
    alt: An infant rides a small boat out of a dark cave into a flowering dawn, guarded by an angel.
  principle: principle-2
  story: Every redwood was once a seedling an inch tall that a deer could have eaten. In a forest most seedlings die, and the ones that live do almost nothing visible for years, putting their effort into roots. The Daoists liked this. The tree that fills your arms grew from a shoot as fine as a hair.
  passages:
    - text: The tree which fills the arms grew from the tiniest sprout; the tower of nine storeys rose from a (small) heap of earth; the journey of a thousand li commenced with a single step.
      attribution: Tao Te Ching 64, trans. James Legge
  question: What small beginning are you tending that nobody can see yet?
  table: What is a small thing you started that is still growing?
- id: wood-the-threads-beneath
  circle: Passage
  name: The Threads Beneath
  from: The forest floor
  picture:
    title: Snap the Whip
    artist: Winslow Homer
    year: "1872"
    source: https://commons.wikimedia.org/wiki/File:Snap_the_Whip_1872_Winslow_Homer.jpg
    license: public domain
    alt: A line of schoolboys run hand in hand, one end tumbling as the chain swings.
  principle: principle-1
  story: Under the forest floor, fungal threads wrap the roots of nearly every tree and run between them. The fungus trades water and minerals for the sugar the trees make, and some of what one tree makes can pass through the threads to another. How much passes, and how deliberately, is still argued over. A walk in the woods is a walk across a net you cannot see.
  passages:
    - text: Frequently consider the connection of all things in the universe and their relation to one another. For in a manner all things are implicated with one another, and all in this way are friendly to one another.
      attribution: Marcus Aurelius, *Meditations* VI.38, trans. George Long
  question: Who are you connected to underground, in ways neither of you sees?
  table: Who has been feeding you without your knowing it?
- id: wood-first-leaf
  circle: Passage
  name: First Leaf
  from: The mountains in spring
  picture:
    title: Spring Blossoms, Montclair, New Jersey
    artist: George Inness
    year: c. 1891
    source: https://commons.wikimedia.org/wiki/File:Spring_Blossoms,_Montclair,_New_Jersey_MET_DT98.jpg
    license: CC0
    alt: A small figure walks a meadow path under trees just coming into pale bloom.
    trim:
      top: 2.2
      right: 1.5
      bottom: 2
      left: 1.3
  principle: principle-2
  story: The first leaves of spring come out small and soft, a green so pale it is almost yellow, before the tree has made the tougher leaves of summer. In the mountains the leaf-out climbs the slopes a little higher every day. Jesus told his listeners to learn from the fig tree, which tells you summer is near when its branch turns tender.
  passages:
    - text: Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer is nigh.
      attribution: Matthew 24:32, King James Version
  question: What is putting out its first tender leaves in you?
  table: What sign told you a new season was coming?
- id: wood-the-bare-mountain
  circle: Passage
  name: The Bare Mountain
  from: Mencius
  picture:
    title: The Lackawanna Valley
    artist: George Inness
    year: c. 1856
    source: https://commons.wikimedia.org/wiki/File:George_Inness_-_The_Lackawanna_Valley_-_Google_Art_Project.jpg
    license: public domain
    alt: A boy reclines on a hillside of fresh stumps, watching a train cross the cleared valley.
    trim:
      bottom: 0.2
  principle: principle-7
  story: Mencius pointed to Ox Mountain, bare and brown outside the city, and said it had once been beautiful with trees. People cut them, and when sprouts came back the cattle and goats grazed them, and now everyone thinks the mountain was always bare. That, he said, is what happens to the goodness in a person. What you see now is not the nature of the mountain.
  passages:
    - text: The trees of the Niu mountain were once beautiful. Being situated, however, in the borders of a large State, they were hewn down with axes and bills;—and could they retain their beauty? … To these things is owing the bare and stripped appearance of the mountain, and when people now see it, they think it was never finely wooded. But is this the nature of the mountain?
      attribution: Mencius VI.1.8, trans. James Legge
  question: What in you looks bare that was only cut back and grazed?
  table: What did someone see in you that you had stopped seeing?
- id: wood-the-unremembered
  circle: Passage
  name: The Unremembered
  from: Ecclesiasticus
  picture:
    title: River in the Catskills
    artist: Thomas Cole
    year: "1843"
    source: https://commons.wikimedia.org/wiki/File:Thomas_Cole_-_River_in_the_Catskills_-_47.1201_-_Museum_of_Fine_Arts.jpg
    license: public domain
    alt: A small woodcutter swings his axe among stumps above a river valley.
  principle: principle-5
  story: Walking in a second-growth forest you pass the stumps of the first one, huge and gone grey, cut a century ago by people whose names no one knows, for houses no one remembers. The book of Ben Sira praises the famous ancestors, then turns to the others, the ones who left no memorial, and says their goodness was not forgotten anyway.
  passages:
    - text: And some there be, which have no memorial; who are perished, as though they had never been; and are become as though they had never been born; and their children after them. But these were merciful men, whose righteousness hath not been forgotten.
      attribution: Ecclesiasticus 44:9–10, King James Version
  question: Whose unremembered work are you standing on today?
  table: Name someone in your family line whose name you do not know but whose life you can guess.
- id: wood-the-hollow
  circle: Passage
  name: The Hollow
  from: The old tree
  picture:
    title: Pioneers of the Woods
    artist: Albert Bierstadt
    year: 19th century
    source: https://commons.wikimedia.org/wiki/File:Albert_Bierstadt_-_Pioneers_of_the_Woods.jpg
    license: public domain
    alt: Two very old oaks in full leaf, one broken at the top with a pocked trunk.
  principle: principle-8
  story: An old tree is often hollow, its heartwood rotted away while the living wood around it keeps growing. It stands as well as before, and the hollow fills with life, owls, bats, bees, a bear in winter. The Daoists said that the use of a cup, a room or a wheel is in its emptiness.
  passages:
    - text: Clay is fashioned into vessels; but it is on their empty hollowness, that their use depends. The door and windows are cut out (from the walls) to form an apartment; but it is on the empty space (within), that its use depends.
      attribution: Tao Te Ching 11, trans. James Legge
  question: What emptiness in you is making room for something to live?
  table: What empty space in your life turned out to be useful?
- id: wood-the-tree-of-the-field
  circle: Passage
  name: The Tree of the Field
  from: Deuteronomy
  picture:
    title: The Veteran in a New Field
    artist: Winslow Homer
    year: "1865"
    source: https://commons.wikimedia.org/wiki/File:The_Veteran_in_a_New_Field_MET_DP102298.jpg
    license: CC0
    alt: A Union veteran, his army jacket thrown down, mows wheat with a scythe.
    trim:
      top: 0.9
      right: 0.6
      bottom: 1.2
      left: 0.6
  principle: principle-4
  story: The law of Deuteronomy forbids an army besieging a city to cut down its fruit trees for siege works. You may eat from them, it says. The verse can be read two ways, that the tree of the field is a person's life, or, are the trees of the field people, that they should be besieged by you? The rabbis built on it a whole ethic against needless destruction, called bal tashchit, do not destroy.
  passages:
    - text: "When thou shalt besiege a city a long time, in making war against it to take it, thou shalt not destroy the trees thereof by forcing an axe against them: for thou mayest eat of them, and thou shalt not cut them down (for the tree of the field is man's life)."
      attribution: Deuteronomy 20:19, King James Version
  question: What are you about to cut down that you live on?
  table: What do we waste that we could keep?
- id: wood-the-edge-of-the-wood
  circle: Passage
  name: The Edge of the Wood
  from: Every trailhead
  picture:
    title: Early Morning at Cold Spring
    artist: Asher Brown Durand
    year: "1850"
    source: https://commons.wikimedia.org/wiki/File:HRSOA_AsherDurand-Early_morning_at_cold_spring_1850.jpg
    license: public domain
    alt: A lone figure stands at the forest's edge by the water, looking out toward a distant steeple.
  principle: principle-6
  story: Coming out of a forest, the light changes before you reach the edge. The trunks thin, the ground brightens, there is sky between the trees, and then the open, the trailhead, the road. Ecologists say the edge between two places holds more life than either. Every walk in the woods ends with returning to the people you left, carrying something.
  passages:
    - text: The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.
      attribution: Psalm 121:8, King James Version
  question: What are you carrying out of the wood, and to whom?
  table: What did you bring home from somewhere that changed you?
- id: wood-climbing-to-see
  circle: Passage
  name: Climbing to See
  from: Luke
  picture:
    title: The Two Guides
    artist: Winslow Homer
    year: "1877"
    source: https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_The_two_guides.jpg
    license: public domain
    alt: Two Adirondack guides stand on a high slope, one pointing out over the clouds.
    trim:
      top: 0.8
      right: 0.5
      bottom: 0.4
      left: 0.5
  principle: principle-7
  story: Zacchaeus was a tax collector, rich and unloved and short, and when the crowd blocked his view he ran ahead and climbed a sycamore fig by the road. That is where he was seen, and called down, and asked to host dinner. Children climb trees to see farther. Adults mostly forget that it can be done.
  passages:
    - text: "And he sought to see Jesus who he was; and could not for the press, because he was little of stature. And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way."
      attribution: Luke 19:3–4, King James Version
  question: What would you have to climb, and risk looking foolish, to see what you need to see?
  table: When did you go out on a limb, and what did you see from there?
- id: wood-under-the-juniper
  circle: Passage
  name: Under the Juniper
  from: 1 Kings
  picture:
    title: Elijah in the Desert
    artist: Washington Allston
    year: "1818"
    source: https://commons.wikimedia.org/wiki/File:Washington_Allston_-_Elijah_in_the_Desert_-_Google_Art_Project.jpg
    license: public domain
    alt: Elijah lies small and spent beneath a stripped desert tree while a raven brings him food.
  principle: principle-6
  story: Elijah, worn out and afraid, walked a day into the wilderness, sat down under a desert broom, which the old English Bible calls a juniper, and asked to die. Then he slept. An angel woke him, gave him bread baked on hot stones and a jar of water, and let him sleep again, and only after the second meal did he go on. Before anything else, the exhausted need to eat and sleep under a tree.
  passages:
    - text: And as he lay and slept under a juniper tree, behold, then an angel touched him, and said unto him, Arise and eat.
      attribution: 1 Kings 19:5, King James Version
  question: What would it mean to eat and sleep before you decide anything?
  table: Who has fed you when you were at the end of yourself?
