  seasons:
    - key: bloom
      name: Bloom
      from: 0
      to: 20
      passages:
        - text: "For, lo, the winter is past, the rain is over and gone; The flowers appear on the earth; the time of the singing of birds is come."
          attribution: Song of Songs 2:11–12, King James Version
    - key: gold
      name: Gold
      from: 21
      to: 40
      passages:
        - text: "The sun also ariseth, and the sun goeth down, and hasteth to his place where he arose."
          attribution: Ecclesiastes 1:5, King James Version
    - key: ember
      name: Ember
      from: 41
      to: 51
      passages:
        - text: "This world, which is the same for all, no one of gods or men has made; but it was ever, is now, and ever shall be an ever-living Fire, with measures of it kindling, and measures going out."
          attribution: Heraclitus, fragment 20 (Diels 30), trans. John Burnet, *Early Greek Philosophy*
    - key: rain
      name: Rain
      from: 52
      to: 71
      passages:
        - text: "Hath the rain a father? or who hath begotten the drops of dew?"
          attribution: Job 38:28, King James Version
