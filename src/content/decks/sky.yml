- id: moon
  kind: heaven
  n: 1
  name: The Moon
  alt: change
  art: moon
  above: "The nearest and quickest of the wandering lights, and the only one that visibly changes. Chang'e rose to it with a rabbit. In the Haudenosaunee Thanksgiving Address it is Grandmother, who keeps the tides and the births. Dante placed in its heaven the souls whose vows had wavered, and the Zen masters warned not to mistake the finger pointing at it for the moon. Its lesson in every tongue is the same: light that waxes and wanes is still light. Tonight it is {phase}."
  set: the demand to be the same every day.
  receive: permission to wax and wane, and to be dark for a night without being gone.
  passages:
    - text: "When I consider thy heavens, the work of thy fingers, the moon and the stars, which thou hast ordained; What is man, that thou art mindful of him?"
      attribution: Psalm 8:3–4, King James Version
  question: What phase are you in, and are you trying to be in another?
- id: mercury
  kind: heaven
  n: 2
  name: Mercury
  alt: the messenger
  art: mercury
  above: The light that never strays far from the sun, hard to see and quick to vanish. Hermes to the Greeks, Thoth who invented writing to the Egyptians, the planet of speech, roads, trade and the crossing of thresholds. The Hermetic books tell the whole ascent of the soul under his name. Dante found in his heaven the souls who did good for the sake of their own fame.
  set: the need to be heard before you have understood.
  receive: the word that is yours to carry, and the road it goes by.
  passages:
    - text: A word fitly spoken is like apples of gold in pictures of silver.
      attribution: Proverbs 25:11, King James Version
  question: What message are you carrying, and whose is it?
- id: venus
  kind: heaven
  n: 3
  name: Venus
  alt: the gates
  art: venus
  above: "The brightest of the wanderers, morning star and evening star, the same light under two names. Inanna went down through seven gates and at each one gave up an ornament: the crown, the lapis beads, the measuring rod, the robe. She came back up through the same seven. Aphrodite rose from the sea. Dante set the lovers in this heaven, and Sappho called the evening star the one that brings everything home."
  set: the ornament this gate asks for.
  receive: the self that remains when it is gone.
  passages:
    - text: Evening, thou that bringest all that bright morning scattered; thou bringest the sheep, the goat, the child back to her mother.
      attribution: Sappho, fragment 95, trans. Henry Thornton Wharton, 1885
  question: What is the gate asking you to leave at the door, and what remains when you do?
- id: sun
  kind: heaven
  n: 4
  name: The Sun
  alt: the center
  art: sun
  above: The middle of the seven, with three heavens below it and three above. Ra in his boat, Amaterasu drawn out of her cave by laughter and a mirror, Surya with seven horses. Francis called it Brother Sun and said it bore the likeness of the highest thing he knew. Dante filled this heaven with the wise, dancing in two rings. It is the symbol of the self that gives light without deciding to, and of the center that everything else turns around. Tonight it stands in {sign}.
  set: the wish to be the center of someone else's sky.
  receive: the light you already give without trying.
  passages:
    - text: |-
        Praised be You, my Lord, through Brother Sun,
        who brings the day; and You give light through him.
        And he is beautiful and radiant in all his splendor!
        Of You, Most High, he bears the likeness.
      attribution: Francis of Assisi, *Canticle of the Sun*, trans. Bill Barrett, adapted
  question: What rises in you every day whether or not you attend to it?
- id: mars
  kind: heaven
  n: 5
  name: Mars
  alt: the will
  art: mars
  above: The red wanderer, the one that stops and walks backward across the sky before going on. Nergal to Babylon, Ares to the Greeks, Mangala to India. The planet of will, strife and courage, and of the force that builds when it is aimed and breaks when it is not. Dante filled this heaven with those who fought for what they believed and set a cross of light in it. The Daoists would say its backward loop is the Way moving by contraries.
  set: the fight you are having with yourself.
  receive: the force that was for building.
  passages:
    - text: |-
        The movement of the Tao
        By contraries proceeds;
        And weakness marks the course
        Of Tao's mighty deeds.
      attribution: Tao Te Ching 40, trans. James Legge
  question: Where is your force going tonight, and is it aimed?
- id: jupiter
  kind: heaven
  n: 6
  name: Jupiter
  alt: the just
  art: jupiter
  above: The slow bright king of the wanderers. Zeus, Marduk who ordered the world, Brihaspati the teacher of the gods, Thor whose day is Thursday. The planet of expansion, abundance, law and generosity, and of their shadow, appetite. In Dante's sixth heaven the souls of the just fly up as letters and spell out a sentence about loving justice, then settle into the shape of an eagle.
  set: appetite dressed as generosity.
  receive: the room your life is asking for.
  passages:
    - text: Look round at the courses of the stars, as if thou wert going along with them; and constantly consider the changes of the elements into one another, for such thoughts purge away the filth of the terrene life.
      attribution: Marcus Aurelius, *Meditations* VII.47, trans. George Long
  question: Where is your life asking for more room, and is that generosity or appetite?
- id: saturn
  kind: heaven
  n: 7
  name: Saturn
  alt: time
  art: saturn
  above: The farthest and slowest light the ancients could see, and so the planet of time, age, limit and patience. Kronos with the scythe. The old man. Saturday, his day, which is also the Sabbath, when the work stops. Dante placed the contemplatives in this heaven, climbing a golden ladder out of sight. Astrologers call its return to where it stood at your birth the season when life asks which structures you will keep. In the ascent it is the last gate before the stars.
  set: the fear that time is against you.
  receive: the shape that limits give, and the rest at the end of the week.
  passages:
    - text: So teach us to number our days, that we may apply our hearts unto wisdom.
      attribution: Psalm 90:12, King James Version
  question: What structure in your life is asking to be honored, and what is asking to be outgrown?
- id: pleiades
  kind: stars
  name: The Pleiades
  alt: the sisters
  art: pleiades
  above: "A small knot of light that every people has named: seven sisters pursued by the hunter, Matariki whose rising opens the Māori year, Subaru the gathering, the nurses of the war god in India. Nearly every telling explains why one of the seven is missing. Their rising at dusk opened the planting year for the Greeks and the sailing season in the Andes."
  set: the count that insists on seven.
  receive: the sister you can almost see.
  passages:
    - text: Canst thou bind the sweet influences of Pleiades, or loose the bands of Orion?
      attribution: Job 38:31, King James Version
  question: Who or what is the sister you can almost see?
- id: orion
  kind: stars
  name: Orion
  alt: the hunter
  art: orion
  above: The giant who stands up in the east as the year turns cold. The hunter killed by the scorpion and set opposite it so the two never share a sky. Sah to the Egyptians, the soul of Osiris, with the dog star at his heel. Three brothers in a canoe to the Yolŋu. The red star at his shoulder is old and swollen and may already be gone, so that what you see is what was.
  set: the hunt that has become the hunter.
  receive: the season you recognize by its first figure.
  passages:
    - text: Which maketh Arcturus, Orion, and Pleiades, and the chambers of the south.
      attribution: Job 9:9, King James Version
  question: What do you only recognize when the season turns?
- id: dipper
  kind: stars
  name: The Bear
  alt: the pole
  art: dipper
  above: Seven stars that circle the one point that does not move. A bear to the Greeks and to many North American peoples, hunted round the pole each year and bleeding onto the autumn leaves. A plough, a wagon, a ladle, the Seven Sages, the drinking gourd that pointed north for people escaping slavery. Confucius compared the good ruler to the pole star, keeping its place while everything turns toward it.
  set: the course you have not checked in years.
  receive: the one point that holds while the rest turns.
  passages:
    - text: He who exercises government by means of his virtue may be compared to the north polar star, which keeps its place and all the stars turn towards it.
      attribution: Confucius, *Analects* 2.1, trans. James Legge
  question: What do you steer by, and when did you last check it was still there?
- id: milkyway
  kind: stars
  name: The Milky Way
  alt: the road
  art: milkyway
  above: The river of light that stands up out of the south on summer nights. The Silver River that keeps the Weaver from the Cowherd, who meet once a year on a bridge of magpies. Mayu, the river of the Inca sky. Milk from Hera's breast. The Emu drawn in the dark lanes for Aboriginal Australians. For the Maya and for many peoples of the north it was the road the dead walk. It is the whole we belong to, seen from inside.
  set: the need to see the whole from outside.
  receive: a place on the road.
  passages:
    - text: He telleth the number of the stars; he calleth them all by their names.
      attribution: Psalm 147:4, King James Version
  question: What are you part of that is too large to see from inside?
- id: silence
  kind: beyond
  name: The Silence
  alt: the answer that does not come
  art: silence
  above: Every tradition that climbed the ladder met silence at the top. Elijah on the mountain heard wind, earthquake and fire, and then a still small voice. The Cloud of Unknowing says God is known by what cannot be known. The Zen hall is silent on purpose. We have listened to the sky for a long time now and nothing has answered, and the silence can be held as loneliness or as the first condition of prayer.
  set: the demand for an answer.
  receive: the quiet in which one could be heard.
  passages:
    - text: "And after the earthquake a fire; but the LORD was not in the fire: and after the fire a still small voice."
      attribution: 1 Kings 19:12, King James Version
  question: What are you listening for that has not answered yet?
- id: oldlight
  kind: beyond
  name: The Old Light
  alt: what you see is what was
  art: oldlight
  above: Nothing you see in the sky is there now. The light of the nearest wanderer is minutes old, the light of the red star in the hunter's shoulder left before anyone now alive was born, and some of what shines tonight has already gone out. The sky is a letter from the dead, which is what every people meant by setting their ancestors among the stars. To look up is to stand in the presence of what was.
  set: the belief that what you see is what is.
  receive: the company of the ones who sent the light.
  passages:
    - text: Where is the way where light dwelleth? and as for darkness, where is the place thereof …
      attribution: Job 38:19, King James Version
  question: Whose light are you still living by?
- id: mirror
  kind: beyond
  name: The Mirror
  alt: as above, so below
  art: mirror
  above: "The Emerald Tablet says what is below is like what is above. The Kabbalists drew the same tree in the heavens and in the body. The Upanishads say the self within is the self of the whole. And the oldest warning about the sky is that whatever we meet out there, we will meet ourselves first: the stories of gods, visitors and voices all turn out to be about the ones who told them. The sky is a mirror held very far away."
  set: the hope that the answer is out there.
  receive: the face in the glass.
  passages:
    - text: That which is below is like that which is above & that which is above is like that which is below to do the miracles of one only thing.
      attribution: The Emerald Tablet, trans. Isaac Newton, Keynes MS 28, c. 1680–1690s, normalized text
  question: What have you been calling the sky that is yourself?
- id: message
  kind: beyond
  name: The Message
  alt: cast upon the waters
  art: message
  above: "People have always sent words where no answer can come back: lanterns floated on rivers for the dead, prayers written on slips and tied to trees, bread cast on the waters. In our own time a record of greetings and songs was sent out past the planets for no one, on purpose. The message is not for the one who may receive it. It is for the one who sends it, to learn what they would say."
  set: the condition that someone must hear it.
  receive: the knowledge of what you would say.
  passages:
    - text: "Cast thy bread upon the waters: for thou shalt find it after many days."
      attribution: Ecclesiastes 11:1, King James Version
  question: Who are you speaking to when you know they cannot answer in your lifetime?
- id: stranger
  kind: beyond
  name: The Stranger
  alt: the visitor
  art: stranger
  above: "Three strangers came to Abraham's tent under the oaks in the heat of the day, and he ran to meet them. The gods walked the roads of Phrygia as beggars and only one old couple took them in. Every people has a story of the visitor who is more than they seem, which is the oldest answer to the question of what we would do if anyone arrived: we would be judged by how we received them. Hospitality to the unknown is the whole ethic of contact."
  set: the test you would put a stranger to.
  receive: the table already laid.
  passages:
    - text: "Be not forgetful to entertain strangers: for thereby some have entertained angels unawares."
      attribution: Hebrews 13:2, King James Version
  question: Who has come to your door lately that you have not yet recognized?
- id: view
  kind: beyond
  name: The View from Above
  alt: the small earth
  art: view
  above: Scipio dreamed he was carried up among the spheres and saw the earth so small that he was ashamed of the empire. Marcus Aurelius told himself to look down from a height on the herds, the harvests and the funerals. Zhuangzi's great bird rose so high that the earth below looked as blue as the sky looks from here. The ones who went up in our own time saw the same thing and came back changed. Distance is a kind of seeing.
  set: the size you have given your troubles.
  receive: the scale of what you belong to.
  passages:
    - text: How small a part of the boundless and unfathomable time is assigned to every man, for it is very soon swallowed up in the eternal! … and on what a small clod of the whole earth thou creepest!
      attribution: Marcus Aurelius, *Meditations* XII.32, trans. George Long
  question: From that height, which of today's worries would still be visible?
- id: net
  kind: beyond
  name: The Net
  alt: every jewel reflects every other
  art: net
  above: In the heaven of Indra hangs a net with a jewel at every knot, and each jewel reflects every other jewel and the reflections in them, without end. The Buddhist sutras count worlds like sands of the Ganges. The old philosophers argued that infinite space must hold other earths, and the sky has lately agreed with them. The net was never a claim about astronomy. It is a picture of what it means that nothing exists alone.
  set: the belief that you are the only jewel.
  receive: your reflection in every other.
  passages:
    - ref: cosmology-indra-s-net-and-the-wheel-of-becoming-1
  question: Who is reflected in you tonight, and whom do you reflect?
- id: deep
  kind: beyond
  name: The Deep
  alt: before the first light
  art: deep
  above: Before the gods, the dark. Nun, the waters of Egypt. Ginnungagap, the yawning gap of the north. The Ein Sof of the Kabbalists, without end, from which the first light was drawn. The hymn of the Rig Veda says there was neither being nor non-being then, and asks who could know. Most of what there is cannot be seen, and the oldest light arriving tonight set out before there were stars to leave from. The dark is not the absence of the sky. It is most of it.
  set: the need for the dark to be empty.
  receive: the ground the first light stood on.
  passages:
    - text: Who verily knows and who can here declare it, whence it was born and whence comes this creation? The Gods are later than this world's production. Who knows then whence it first came into being?
      attribution: Rig Veda 10.129.6, trans. Ralph T. H. Griffith
  question: What is the dark holding for you that you have been calling nothing?
- id: dogstar
  kind: stars
  name: The Dog Star
  alt: the rising before the flood
  art: dogstar
  above: The brightest of the fixed stars, at the hunter's heel. In Egypt she was Sopdet, and her first rising before dawn in high summer announced the flooding of the Nile and opened the year. The Greeks called the heavy days of her rising the dog days. In China the same star is the Celestial Wolf, watched by an archer in the south. Every people that saw her return read her as the herald of what comes next.
  set: the wish to be warned of nothing.
  receive: the sign that comes before the water.
  passages:
    - text: Arise, shine; for thy light is come, and the glory of the LORD is risen upon thee.
      attribution: Isaiah 60:1, King James Version
  question: What is rising in you just before the flood?
- id: scorpion
  kind: stars
  name: The Scorpion
  alt: the heart of fire
  art: scorpion
  above: A long curve of stars low in the summer south, with a red star at its heart. The Greeks said the scorpion was sent against the hunter and set across the sky from him, so that one rises as the other sets. To the Polynesian navigators the curve is the fishhook of Maui, which hauled the islands up out of the sea. In China the red star is the heart of the Azure Dragon. The heart of the figure is what everyone sees first.
  set: the sting you keep ready.
  receive: the heart, the brightest part of you.
  passages:
    - text: Keep thy heart with all diligence; for out of it are the issues of life.
      attribution: Proverbs 4:23, King James Version
  question: What is the red heart of the thing you are afraid of?
- id: swan
  kind: stars
  name: The Swan
  alt: the cross on the river
  art: swan
  above: A great cross of stars flying down the river of light on summer nights, wings spread, neck outstretched toward the south. The Greeks saw Zeus in the shape of a swan, and later Christians called it the Northern Cross. It flies along the very road that many peoples said the dead walk, and in that light it is the soul in flight, going the way everyone goes.
  set: the fear of the long flight.
  receive: wings for the road.
  passages:
    - text: If I take the wings of the morning, and dwell in the uttermost parts of the sea; Even there shall thy hand lead me, and thy right hand shall hold me.
      attribution: Psalm 139:9–10, King James Version
  question: Where are you flying, and what holds you on the way?
- id: weaver
  kind: stars
  name: The Weaver and the Cowherd
  alt: the meeting across the river
  art: weaver
  above: Two bright stars on either side of the summer river of light. In China and Japan they are the weaver girl of heaven and the cowherd who loved her, kept apart by the Silver River and allowed to meet one night a year, when the magpies of the world fly up and make a bridge of their wings. On that night people tie wishes to bamboo. It is the oldest story of love held across a distance.
  set: the belief that distance ends love.
  receive: the bridge that comes when it comes.
  passages:
    - text: Many waters cannot quench love, neither can the floods drown it.
      attribution: Song of Songs 8:7, King James Version
  question: Whom do you love across a river, and what would make the bridge?
- id: lion
  kind: stars
  name: The Lion
  alt: the heart of summer
  art: lion
  above: A sickle of stars like a lion's mane, crouched along the road of the sun, with the little king, Regulus, at its breast. When the sun passed through the lion in Egypt the river rose, and lion heads were carved on fountains and gates. The Greeks set Heracles' first labor here. Everywhere it is courage and kingship, and the summer heat when the sun is strongest.
  set: the roar that covers fear.
  receive: courage that does not need to be seen.
  passages:
    - text: "The wicked flee when no man pursueth: but the righteous are bold as a lion."
      attribution: Proverbs 28:1, King James Version
  question: Where would you be bold if no one were watching?
- id: bull
  kind: stars
  name: The Bull
  alt: the rain-bringers
  art: bull
  above: A V of stars for the face of a bull, a red eye, two long horns, and the Pleiades riding on its shoulder. In the oldest epic the gods loose the Bull of Heaven on the earth. Zeus took a bull's shape to carry Europa over the sea. The Greeks named the stars of the face the Hyades, the rainy ones, because their setting brought the rains. It is the strength of the earth and the patience of the plough.
  set: the charge you keep making at the same wall.
  receive: the strength that pulls the plough.
  passages:
    - text: My doctrine shall drop as the rain, my speech shall distil as the dew, as the small rain upon the tender herb, and as the showers upon the grass.
      attribution: Deuteronomy 32:2, King James Version
  question: Where is your strength best spent, charging or pulling?
- id: twins
  kind: stars
  name: The Twins
  alt: the brother who shares
  art: twins
  above: Two bright stars side by side in the winter sky. The Greeks said one brother was mortal and one was the son of Zeus, and when the mortal one died the other refused to live without him, so they share one life between them, a day below the earth and a day among the gods. Sailors saw them as the light on the mast in a storm. In India they are the twin horsemen who bring the dawn and heal the sick.
  set: the wish to be spared alone.
  receive: the one who shares your days.
  passages:
    - text: "Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up."
      attribution: Ecclesiastes 4:9–10, King James Version
  question: Whose life is bound with yours, and what have you shared?
- id: queen
  kind: stars
  name: The Queen
  alt: the turning throne
  art: queen
  above: A crooked W of stars close to the pole, turning around it all night and all year. The Greeks said Cassiopeia boasted that she was more beautiful than the daughters of the sea, and for her pride she was set in the sky on her throne, which swings her head down for half of every night. The throne is a seat of honor and a wheel at once. What is raised up turns.
  set: the boast that turns the sea against you.
  receive: grace in being turned.
  passages:
    - text: Pride goeth before destruction, and an haughty spirit before a fall.
      attribution: Proverbs 16:18, King James Version
  question: What would you stop defending if you knew the wheel would turn anyway?
- id: herdsman
  kind: stars
  name: The Herdsman
  alt: the keeper of the bear
  art: herdsman
  above: A kite of stars following the great bear around the pole, with a golden-orange star at its foot. Arcturus means the guardian of the bear. The herdsman drives the bear, or the ploughman follows the plough, through the year. The navigators of the Pacific steered by the same star, which passes overhead in Hawaii, and called it the star of gladness. It is the one who keeps watch and follows, and brings the travelers home.
  set: the need to lead every step.
  receive: the honor of keeping watch.
  passages:
    - text: Canst thou bring forth Mazzaroth in his season? or canst thou guide Arcturus with his sons?
      attribution: Job 38:32, King James Version
  question: Whom are you keeping watch over, and who steers by you?
- id: chained
  kind: stars
  name: The Chained Woman
  alt: the one set free
  art: chained
  above: A line of stars reaching from the winged horse. The Greeks said Andromeda was chained to a rock by the sea to pay for her mother's boast, and freed by a hero who came down out of the sky. In her girdle lies a faint cloud of light that the Persian astronomers called the little cloud. The figure is a bond and a release in the same stars. Every chain in the sky is drawn with its loosing.
  set: the chain that was never yours to carry.
  receive: the loosing that comes from outside you.
  passages:
    - text: "O LORD, truly I am thy servant; I am thy servant, and the son of thine handmaid: thou hast loosed my bonds."
      attribution: Psalm 116:16, King James Version
  question: What are you chained to for someone else's boast?
- id: archer
  kind: stars
  name: The Archer and the Center
  alt: where the river is widest
  art: archer
  above: Low in the summer south, the archer draws his bow at the scorpion's heart, and just beyond his arrow the river of light is widest and brightest, because there lies the center of the great wheel of stars we turn in. The Babylonians saw a warrior god here, and the Greeks the wise centaur who taught heroes. To aim, the old archers said, is to find the center in yourself.
  set: the target outside you.
  receive: the center you aim from.
  passages:
    - text: The man who would be benevolent is like the archer. The archer adjusts himself and then shoots. If he misses, he does not murmur against those who surpass himself. He simply turns round and seeks the cause of his failure in himself.
      attribution: Mencius II.1.7, trans. James Legge
  question: Where do you aim from, and when you miss, where do you look?
- id: falling
  kind: stars
  name: The Falling Stars
  alt: the tears of August and the winter fire
  art: falling
  above: Twice a year the sky rains light. In August the falling stars stream from the hero who freed the chained woman, and in Italy they are called the tears of Saint Lawrence, whose feast falls in the same week. In December they come out of the Twins, on the longest nights. In many places a falling star is a soul passing, and in many more it is the moment for a wish. Each one is the only light in the heavens that never comes back.
  set: the wish you never say aloud.
  receive: what passes, while it passes.
  passages:
    - text: "Thou tellest my wanderings: put thou my tears into thy bottle: are they not in thy book?"
      attribution: Psalm 56:8, King James Version
  question: What would you wish if you saw one fall tonight?
- id: ram
  kind: stars
  name: The Ram
  alt: the one sent in your place
  art: ram
  above: A short bent line of stars, the head of a ram turned to look behind it. In Babylon it was first the hired man of the fields and later the ram of Dumuzi the shepherd. Egypt gave it to Amun, the god with a ram's head. The Greeks said a golden ram came for a boy who was about to be sacrificed and carried him away through the air, though his sister fell into the sea. The sun crossed into spring in these stars, so they became the first of the signs. It is the beginning that comes in place of the sacrifice.
  set: the sacrifice no one is asking of you.
  receive: the ram in the thicket.
  passages:
    - text: "And Abraham lifted up his eyes, and looked, and behold behind him a ram caught in a thicket by his horns: and Abraham went and took the ram, and offered him up for a burnt offering in the stead of his son."
      attribution: Genesis 22:13, King James Version
  question: What are you ready to give up that no one has asked you to give?
- id: crab
  kind: stars
  name: The Crab
  alt: the gate of souls
  art: crab
  above: The dark sign, so faint that it was called black and without eyes, with a pale smudge of light at its breast. The Greeks said a crab came out to bite Heracles in the foot while he fought the Hydra, and when he killed it Hera set it among the stars. They called the smudge the Manger, with a star on either side for the asses that feed there. In China it is the Ghost, a spirit riding in a carriage, pale as willow pollen on the wind. Porphyry called the Crab the gate through which souls come down to be born.
  set: the armor you no longer need.
  receive: the soft light at the heart of the dark.
  passages:
    - text: It has two entrances, one facing North by which mortals can go down into the cave, while the other comes from the South and is more mysterious; mortals cannot possibly get in by it, it is the way taken by the gods.
      attribution: Homer, *Odyssey* XIII, trans. Samuel Butler
  question: What soft thing is your armor protecting, and does it still need protecting?
- id: maiden
  kind: stars
  name: The Maiden
  alt: the last to leave
  art: maiden
  above: A long figure of stars along the sun's road, holding a bright ear of wheat. In Babylon these stars were the Furrow, the goddess Shala and her ear of grain. The Greeks saw Demeter and her daughter in them, and above all Justice, who lived among people in the golden age and sat with the elders in the marketplace, urging kinder judgments. As people grew harder she withdrew to the hills, and at last to the sky. She is still there, holding the harvest, near enough to see.
  set: the harsh verdict you have already passed.
  receive: a kinder judgment.
  passages:
    - text: Her men called Justice; but she assembling the elders, it might be in the market-place or in the wide-wayed streets, uttered her voice, ever urging on them judgements kinder to the people.
      attribution: Aratus, *Phaenomena* 105–107, trans. G. R. Mair
  question: Whom are you judging tonight, and what would a kinder judgment sound like?
- id: scales
  kind: stars
  name: The Scales
  alt: the even balance
  art: scales
  above: Two pale stars like the pans of a balance, between the Maiden and the Scorpion. In Babylon they were the Scales, sacred to Shamash, the sun, keeper of truth and justice. The Greeks called them the Claws of the Scorpion, and the Romans gave them back to Justice as the scales in her hand. The sun stood here when day and night were equal. In Egypt the heart of the dead was weighed against a single feather of truth, and it passed if it was no heavier.
  set: the weight you keep adding to one side.
  receive: a heart as light as a feather.
  passages:
    - text: Let me be weighed in an even balance that God may know mine integrity.
      attribution: Job 31:6, King James Version
  question: What is weighing on your heart, and what would balance it?
- id: goatfish
  kind: stars
  name: The Goat-Fish
  alt: the gate of ascent
  art: goatfish
  above: A faint triangle of stars low in the south, a goat in front and a fish behind. It is one of the oldest figures in the sky. In Babylon the Goat-Fish was the emblem of Ea, god of wisdom and of the fresh waters under the earth. The Greeks said Pan dove into a river to escape a monster and came out with a fish's tail. The sun turned back from midwinter in these stars, and Porphyry called them the gate through which souls climb back to the gods.
  set: the footing you refuse to leave.
  receive: the way back up out of the deep.
  passages:
    - text: And of these, theologists say, that Cancer is the gate through which souls descend; but Capricorn that through which they ascend. Cancer is indeed northern, and adapted to descent; but Capricorn is southern, and adapted to ascent.
      attribution: Porphyry, *On the Cave of the Nymphs*, trans. Thomas Taylor
  question: What deep water are you climbing out of, and what climbs with you?
- id: waterbearer
  kind: stars
  name: The Water-Bearer
  alt: the one who pours
  art: waterbearer
  above: A figure pouring a long stream of faint stars from a jar down to the mouth of the southern fish. In Babylon he was the Great One, the god Ea himself, holding a vase that overflows. In India the sign is Kumbha, the water pot. The Greeks told of Ganymede, the shepherd boy carried up to pour for the gods, and of Cecrops, the king who offered the gods water instead of wine. The stream falls freely and the fish below drinks. It is the one who pours without asking who deserves it.
  set: the jar you keep for yourself.
  receive: the gift of pouring out.
  passages:
    - text: For I will pour water upon him that is thirsty, and floods upon the dry ground …
      attribution: Isaiah 44:3, King James Version
  question: Who is thirsty near you, and what are you holding back?
- id: fishes
  kind: stars
  name: The Fishes
  alt: the cord that holds
  art: fishes
  above: Two fishes swimming different ways across the autumn sky, tied together by a long cord with a star at the knot. When the monster Typhon came against the gods, Aphrodite and her son leapt into the Euphrates and swam away as fishes, and in Ovid's telling two fishes carried them to safety on their backs. After that, Hyginus says, the Syrians would not eat fish. The Babylonians already saw a cord in these stars, and the star at the knot is still called the cord. The two pull apart and are not parted.
  set: the wish to be free of every tie.
  receive: the cord that holds while you swim apart.
  passages:
    - text: I drew them with cords of a man, with bands of love …
      attribution: Hosea 11:4, King James Version
  question: What are you tied to that pulls the other way, and what does the cord keep safe?
- id: southernfish
  kind: stars
  name: The Southern Fish
  alt: the mouth that drinks
  art: southernfish
  above: A bright star low in the autumn south, the mouth of a great fish that drinks the stream poured out by the Water-Bearer. Its Arabic name means the mouth of the fish. The Babylonians already saw a fish here, and the Greeks called it the parent of the two fishes that swim above it. In Syria it was the fish that saved the goddess Derceto, and in Egypt the fish that saved Isis. In China the star is the gate of the northern camp. It drinks from a stream that is always being poured.
  set: the way you cling when the water runs low.
  receive: the open water, where no one has to hold you up.
  passages:
    - text: When the springs are dried up, the fishes collect together on the land. Than that they should moisten one another there by the damp about them, and keep one another wet by their slime, it would be better for them to forget one another in the rivers and lakes.
      attribution: Zhuangzi 6, trans. James Legge
  question: What are you keeping alive on dry land that belongs back in the river?
- id: whale
  kind: stars
  name: The Whale
  alt: the wonderful star
  art: whale
  above: A long sea monster sprawled low across the autumn sky beneath the fishes. The Greeks said Poseidon sent it against the shore when the queen boasted, and that the hero who freed the chained woman killed it, or in another telling turned it to stone with the Gorgon's head. Its Arabic star names are the nostril and the whale's tail. Among its stars is the one called Mira, the wonderful, which brightens, fades until the eye cannot find it, and comes back. In the Hebrew scriptures a great fish swallowed Jonah and gave him back to the dry land.
  set: the fear of being swallowed.
  receive: the shore you are given back to.
  passages:
    - text: "I went down to the bottoms of the mountains; the earth with her bars was about me for ever: yet hast thou brought up my life from corruption, O LORD my God."
      attribution: Jonah 2:6, King James Version
  question: What has swallowed you, and what are you learning in its belly?
- id: river
  kind: stars
  name: The River
  alt: the river that receives
  art: river
  above: A long river of faint stars that rises at the hunter's foot and winds away into the south, farther than this sky can follow. The Babylonians called it the star of Eridu, sacred to Enki and the waters of the abyss. The Greeks said it was the river that received Phaethon when he lost the reins of his father's sun and fell burning out of the sky. It was first the Nile and later the Po. Its last star is called the river's end, and from here it never rises. Every river runs on past where we can see.
  set: the reins you could not hold.
  receive: the river that receives the fallen.
  passages:
    - text: |-
        Far distant from his home
        the deep Eridanus received the lad
        and bathed his foaming face.
      attribution: Ovid, *Metamorphoses* 2.323–324, trans. Brookes More
  question: Where have you fallen, and what has been there to receive you?
- id: dolphin
  kind: stars
  name: The Dolphin
  alt: the one who carries
  art: dolphin
  above: A small diamond of stars with a short tail, leaping high in the sky at summer's end. The Greeks said it was the dolphin who found the sea nymph Amphitrite where she hid and won her for Poseidon, and was set among the stars for it. Herodotus tells of the singer Arion, whose sailors plotted to take his money and throw him overboard. He sang one last song and leapt, and a dolphin carried him to shore. Hyginus says Apollo set the dolphin in the sky for the music. In India its four stars are a mansion of the moon whose sign is a drum.
  set: the deck you are afraid to leave.
  receive: the song, and the one who carries the singer.
  passages:
    - text: He maketh the storm a calm, so that the waves thereof are still. Then are they glad because they be quiet; so he bringeth them unto their desired haven.
      attribution: Psalm 107:29–30, King James Version
  question: What would you sing now if you trusted something to carry you?
- id: crow
  kind: stars
  name: The Crow and the Cup
  alt: the errand and the excuse
  art: crow
  above: A small crooked square of stars beside a faint cup, both riding on the back of the long water serpent. The Babylonians saw a raven perched on the serpent's tail, sacred to the god of rain and storm. The Greeks said Apollo sent the crow with his cup to fetch water, and the crow stopped to eat figs, then came back blaming the serpent. Apollo set all three in the sky, with the cup forever just beyond the thirsty bird. In China the four stars are a chariot. In the book of Kings, ravens brought bread to a prophet by a brook.
  set: the excuse you made for the delay.
  receive: the errand, and the water at the end of it.
  passages:
    - text: And the ravens brought him bread and flesh in the morning, and bread and flesh in the evening; and he drank of the brook.
      attribution: 1 Kings 17:6, King James Version
  question: What errand did you leave for figs, and what story are you telling about it?
- id: polestar
  kind: stars
  name: The Pole Star
  alt: the one that does not move
  art: polestar
  above: A modest star at the end of the Little Bear's tail, the one light in the northern sky that seems to stand still while every other light wheels around it. The Greeks said the Phoenicians steered by the Little Bear, and the Old English called the pole star the ship-star. In the Puranas it is Dhruva, a boy turned away from his father's lap, who went into the forest and prayed until he forgot what he had come to ask for, and was given the one seat in heaven that does not move. The still point was never handed to him. It was found.
  set: the place you are waiting for someone to give you.
  receive: the stillness that was yours before anyone made room.
  passages:
    - text: "But Helice, appearing large at earliest night, is bright and easy to mark; but the other is small, yet better for sailors: for in a smaller orbit wheel all her stars. By her guidance, then, the men of Sidon steer the straightest course."
      attribution: Aratus, *Phaenomena* 40–44, trans. G. R. Mair
  question: What place are you still waiting for someone to give you?
- id: dragon
  kind: stars
  name: The Dragon
  alt: the guardian of the old pole
  art: dragon
  above: A long, faint dragon winding between the two Bears, with his head beneath the Kneeler's foot. The Greeks said he was Ladon, set by Hera to guard the golden apples in the garden of the Hesperides. The Arab herders saw instead four mother camels guarding a calf from two hyenas. A dim star in his tail held the pole when the pyramids of Egypt were raised, and in China it is the Right Pivot in the wall around the palace of heaven. The pole has since moved on. Even the center of the sky is a watch that passes from guard to guard.
  set: the treasure you have guarded so long you forgot what it was.
  receive: the rest that comes when the watch passes on.
  passages:
    - text: By his spirit he hath garnished the heavens; his hand hath formed the crooked serpent.
      attribution: Job 26:13, King James Version
  question: What are you guarding, and is it still yours to guard?
- id: crown
  kind: stars
  name: The Crown
  alt: the ring of the one left behind
  art: crown
  above: "A small half-ring of stars between the Herdsman and the Kneeler, with one jewel brighter than the rest. Ariadne gave Theseus the thread that led him out of the labyrinth, and he left her alone on the island of Naxos. Dionysus found her there and set her crown among the stars, so that her name would not be lost. The Welsh called the ring the castle of Arianrhod, the silver circle. The Bedouin called it the bowl of the poor. A crown and an alms bowl in the same stars: what was abandoned is set where everyone can see it."
  set: the thread you gave to someone who sailed on.
  receive: a crown set where it cannot be lost.
  passages:
    - text: Her, in time, lamenting and deserted, Bacchus found and for his love immortalized her name. He set in the dark heavens the bright crown that rested on her brows. Through the soft air it whirled, while all the sparkling jewels changed to flashing fires, assuming in the sky between the Serpent-holder and the Kneeler the well-known shape of Ariadne's Crown.
      attribution: Ovid, *Metamorphoses* VIII.176–182, trans. Brookes More
  question: What were you left holding when someone sailed on, and what crown is in it?
- id: kneeler
  kind: stars
  name: The Kneeler
  alt: the nameless toiler
  art: kneeler
  above: A great figure on one knee in the summer sky, with his foot on the Dragon's head. Aratus wrote that no one could say who he was or at what task he toiled, so people simply called him the one on his knees. Later the Greeks named him Heracles, standing over the dragon of the golden apples, and others saw Prometheus bound, or Sisyphus, or Theseus. The shape came first and the names after. He is anyone who labors without knowing what the labor is for, and keeps on.
  set: the need to know what the work is for.
  receive: the strength of the bent knee.
  passages:
    - text: Right there in its orbit wheels a Phantom form, like to a man that strives at a task. That sign no man knows how to read clearly, nor what task he is bent, but men simply call him On His Knees.
      attribution: Aratus, *Phaenomena* 63–66, trans. G. R. Mair
  question: What are you laboring at that has no name yet?
- id: serpentbearer
  kind: stars
  name: The Serpent-Bearer
  alt: the healer
  art: serpentbearer
  above: A giant holding a great serpent in both hands, his feet on the Scorpion, standing across the road of the sun. The Romans said he was Asclepius, who learned to hold death back by watching one snake bring healing herbs to another. When it seemed that no one in his care would ever die, the king of the gods struck him down, and then set his image in the heavens to honor his work. His staff with one serpent coiled around it is still the sign of healing. To al-Sufi he was the snake charmer. Poison and cure are held in the same hands.
  set: the wound you refuse to look at.
  receive: the cure that lives inside the poison.
  passages:
    - text: "And the LORD said unto Moses, Make thee a fiery serpent, and set it upon a pole: and it shall come to pass, that every one that is bitten, when he looketh upon it, shall live."
      attribution: Numbers 21:8, King James Version
  question: What are you refusing to look at that might heal you?
- id: berenice
  kind: stars
  name: Berenice's Hair
  alt: the vow in the stars
  art: berenice
  above: A faint spray of stars behind the Lion, like loose hair. Queen Berenice of Egypt vowed her long hair to the gods for her husband's safe return from war. She cut it and laid it in a temple, and by morning it was gone. The court astronomer said the goddess had taken it up into the sky, and the poets Callimachus and Catullus sang of it. The Arab astronomers called the same stars the braid, or the tuft at the Lion's tail. A vow kept is never lost. It is only moved somewhere higher.
  set: the part of the vow you hold back.
  receive: the knowledge that what is given in love is not lost.
  passages:
    - text: "But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows."
      attribution: Luke 12:7, King James Version
  question: What have you given for someone else's safe return, and where has it gone?
- id: hero
  kind: stars
  name: The Hero
  alt: the mirror shield
  art: hero
  above: A tall figure striding through the northern sky with a severed head in his hand. The Greeks said Perseus could not look at the Gorgon, whose face turned the living to stone, so he looked at her only in the bronze of his shield, and struck. The Romans named the figure for the hero and the head together. The star in the head the Arabs called the head of the ghoul, Hebrew folklore called it Satan's head, and in China it belongs to the Mausoleum. It dims and brightens like a slow wink. Some things can only be faced in reflection.
  set: the stare that turns you to stone.
  receive: a mirror to face it by.
  passages:
    - text: Nevertheless reflected on the brazen shield, I bore upon my left, I saw her horrid face.
      attribution: Ovid, *Metamorphoses* 4.783–784, trans. Brookes More
  question: What can you only bear to look at in reflection?
- id: horse
  kind: stars
  name: The Winged Horse
  alt: the spring of the Muses
  art: horse
  above: A great square of stars for the body of a horse, with only half of him drawn in the sky. He was born from the Gorgon's blood when the hero struck. The Greeks said he stamped on the mountain of the Muses, where no spring had run, and water broke out of the rock, and whoever drank from it could make poems. The Babylonians saw a field in the same stars, and in India they hold a bed where the moon rests. The horse is the sign of what wells up from hard ground when it is struck.
  set: the waiting for the spring to come to you.
  receive: the water that rises where you strike.
  passages:
    - text: For not yet on Helicon's summit trickled the fountain's springs, but the Horse smote it and straightway the gushing water was shed abroad at the stamp of his forefoot, and herdsmen were the first to call that stream the fountain of the Horse.
      attribution: Aratus, *Phaenomena* 218–221, trans. G. R. Mair
  question: What hard ground in your life is holding water?
- id: charioteer
  kind: stars
  name: The Charioteer
  alt: the one who holds the reins
  art: charioteer
  above: A ring of stars for a driver with the reins in one hand and a she-goat on his shoulder, her two kids at his wrist. The Greeks said he was the first to yoke four horses to a chariot, and that the goat was Amalthea, who nursed the infant Zeus. In Mesopotamia the same stars were a shepherd's crook, and in ancient Peru the bright star kept company with shepherds. In China they were the five chariots of the celestial emperors. Here holding the reins and carrying the young are one art.
  set: the whip you use on yourself.
  receive: the reins, and the patience to hold them.
  passages:
    - text: Now the winged horses and the charioteers of the gods are all of them noble and of noble descent, but those of other races are mixed; the human charioteer drives his in a pair; and one of them is noble and of noble breed, and the other is ignoble and of ignoble breed; and the driving of them of necessity gives a great deal of trouble to him.
      attribution: Plato, *Phaedrus* 246a–b, trans. Benjamin Jowett
  question: Which of your two horses is pulling hardest tonight, and how are you holding the reins?
- id: littlecloud
  kind: stars
  name: The Little Cloud
  alt: the far wheel
  art: littlecloud
  above: A faint smear of light that the Greek astronomers never mentioned, though it was there for them to see. The Arabs drew a great fish across that part of the sky and set the smudge in its mouth, and the Persian astronomer al-Sufi wrote it down as a small cloud. A philosopher guessed it was a whole wheel of stars like the one we turn in, seen from very far away, and so it proved. A dim thing can hold a whole sky.
  set: the habit of passing over what is faint.
  receive: eyes that look a seventh time.
  passages:
    - text: And it came to pass at the seventh time, that he said, Behold, there ariseth a little cloud out of the sea, like a man's hand.
      attribution: 1 Kings 18:44, King James Version
  question: What faint thing are you passing over that holds more than it shows?
- id: egg
  kind: beyond
  name: The World Egg
  alt: the shell that broke into sky and earth
  art: egg
  above: "In the beginning, says the Upanishad, there was only what was not yet. It grew, it turned into an egg, and the egg broke open, a silver half for the earth and a golden half for the sky. In Finland they sang of a duck that nested on the knee of the daughter of the air, and her broken eggs became the vaults of heaven and earth. The Orphics said Night laid a wind-born egg, and Love sprang from it on golden wings. Everything there is was once gathered close, inside one shell."
  set: the wish to have been born finished.
  receive: the shell that breaks so a world can come out.
  passages:
    - text: In the beginning this was non-existent. It became existent, it grew. It turned into an egg. The egg lay for the time of a year. The egg broke open. The two halves were one of silver, the other of gold.
      attribution: Chandogya Upanishad III.19.1, trans. Max Müller
  question: What in you is still inside the shell, and what is it waiting for?
- id: widening
  kind: beyond
  name: The Widening
  alt: sky and earth pushed apart
  art: widening
  above: "Te Rangikāheke of Te Arawa told how Ranginui the sky lay pressed on Papatūānuku the earth, with their children in the dark between them, until Tāne lay on his back, pushed the sky up with his arms and legs, and set posts to hold it there. In Egypt Shu, the air, holds the sky away from the earth, because without the gap nothing could live. Pangu grew each day, and the sky rose with him. The heavens are still widening, every far light drawing away from the rest. The parting is what let the light in."
  set: the wish to keep everything close.
  receive: the light let in by parting.
  passages:
    - text: "Who coverest thyself with light as with a garment: who stretchest out the heavens like a curtain …"
      attribution: Psalm 104:2, King James Version
  question: What parting in your life made room for something to grow?
- id: greatyear
  kind: beyond
  name: The Great Year
  alt: the slow return of the whole sky
  art: greatyear
  above: "Plato wrote of a perfect year in which all the wandering lights come round together and complete their courses at once. The fixed stars turn as well, more slowly than any life. When writing was new the pole stood by a faint star of the Dragon, and the bright star of the Lyre has stood there before and will again. India counted four ages of the world that run down from perfection to the dark age and begin again. The sky tonight is one frame of a turning too long to watch."
  set: the belief that the sky has always looked like this.
  receive: a place in the long turning.
  passages:
    - text: Wherefore he resolved to have a moving image of eternity, and when he set in order the heaven, he made this image eternal but moving according to number, while eternity itself rests in unity; and this image we call time.
      attribution: Plato, *Timaeus* 37d, trans. Benjamin Jowett
  question: What in your life is turning too slowly for you to see it move?
- id: longsleep
  kind: beyond
  name: The Long Sleep
  alt: the world that moved on
  art: longsleep
  above: "Wang Zhi went up the mountain for firewood and stopped to watch two boys at a game. When he looked down, his axe handle had rotted, and when he came home his whole family was gone. Urashima spent what seemed a few days in the palace under the sea and returned to find his house gone and everyone he knew vanished. The Seven Sleepers of Ephesus woke and paid for bread with the coins of an emperor long dead. The one who travels far keeps a different time from the ones who stay."
  set: the wish for the world to wait for you.
  receive: the place you wake into.
  passages:
    - text: But, beloved, be not ignorant of this one thing, that one day is with the Lord as a thousand years, and a thousand years as one day.
      attribution: 2 Peter 3:8, King James Version
  question: What has gone on without you while you were elsewhere?
- id: edge
  kind: beyond
  name: The Edge
  alt: the staff stretched past the rim
  art: edge
  above: "Archytas asked what would happen if he stood at the outermost edge of the heaven and stretched out his staff. If it passed through, there was more beyond, and if something stopped it, that was more beyond too. Lucretius sent a runner to the same coasts to throw a spear. Homer ran the river of Ocean round the rim of Achilles' shield, and the Norse set a serpent in the sea around all lands, biting its own tail. No one has yet reached the edge of the sky. Every horizon is a place to stand and throw again."
  set: the wall you have built at the edge of your world.
  receive: the staff, and the reach past it.
  passages:
    - text: |-
        If some one farthest traveller runs forth
        Unto the extreme coasts and throws ahead
        A flying spear, is't then thy wish to think
        It goes, hurled off amain, to where 'twas sent
        And shoots afar, or that some object there
        Can thwart and stop it?
      attribution: Lucretius, *On the Nature of Things* I, trans. William Ellery Leonard
  question: Where have you decided your world ends, and what would you find if you reached past it?
- id: stardust
  kind: beyond
  name: The Dust and the Stars
  alt: a child of earth and starry heaven
  art: stardust
  above: "Dust thou art, Adam is told, and unto dust shalt thou return. The Orphic dead were buried with leaves of gold that told them what to say at the well of memory: I am a child of Earth and of starry Heaven. Plato wrote that every soul was first assigned to a star, and that one who lived well would go home to dwell in it. The matter of the body was made in stars and scattered when they died. The dust and the stars were never two things."
  set: the line you draw between earth and heaven.
  receive: your two lineages, the ground and the stars.
  passages:
    - text: |-
        I am a child of Earth and of Starry Heaven;
        But my race is of Heaven (alone).
      attribution: Orphic gold tablet from Petelia, in Jane Harrison, *Prolegomena to the Study of Greek Religion*, 1903
  question: What in you remembers where it came from?
- id: breath
  kind: beyond
  name: The Breath
  alt: the worlds breathe out and in
  art: breath
  above: "Krishna tells Arjuna that the worlds have a day and a night. When the day of Brahma dawns the invisible is brought forth into the visible, and when that night falls all that is fades back into what sent it forth. The Daoists likened the space between heaven and earth to a bellows, emptied and never spent. The Stoics taught that the cosmos is drawn back into fire and made again, without beginning or end. No one knows whether the widening sky will be drawn back in. The oldest picture of the world is a breath."
  set: the need for every ending to be final.
  receive: the next breath, whichever way it goes.
  passages:
    - text: |-
        May not the space between heaven and earth be compared to a bellows?
        'Tis emptied, yet it loses not its power;
        'Tis moved again, and sends forth air the more.
      attribution: Tao Te Ching 5, trans. James Legge
  question: Are you breathing out tonight, or breathing in?
- id: traveler
  kind: beyond
  name: The Far Traveler
  alt: the one who does not come back
  art: traveler
  above: "Abram was told to leave his country, his kindred and his father's house for a land he would be shown, and he departed. Three Irishmen came to Cornwall in a boat without oars, because they wished to live in pilgrimage for the love of God and cared not where. The Seafarer of the Old English poem knows the cold and loneliness of the winter sea and still cannot stay ashore. Every age dreams of the one who sets out so far that no one at home sees them arrive. The going is the vow."
  set: the need to come back the same.
  receive: the road that is home now.
  passages:
    - text: Now the LORD had said unto Abram, Get thee out of thy country, and from thy kindred, and from thy father's house, unto a land that I will shew thee …
      attribution: Genesis 12:1, King James Version
  question: What are you ready to leave without knowing where the road ends?
- id: lastlight
  kind: beyond
  name: The Last Light
  alt: the green earth after the fire
  art: lastlight
  above: "The Norse seeress saw the sun turn black and the hot stars whirled down from heaven, and then the earth rising again all green from the waves. Othin was told that before the wolf takes the sun, she bears a bright daughter who walks her mother's paths. The Buddha told of seven suns rising one after another until the world burned away, to teach that nothing made lasts. Isaiah heard of new heavens and a new earth. Even the sun will go out, and these tellings hold the end as a turning."
  set: the dread of the end.
  receive: the green that rises after.
  passages:
    - text: |-
        Now do I see the earth anew
        Rise all green from the waves again;
        The cataracts fall, and the eagle flies,
        And fish he catches beneath the cliffs.
      attribution: Völuspá 59, *The Poetic Edda*, trans. Henry Adams Bellows
  question: What is ending in your life, and what is already rising from it?
